 je_england_1: "The Hundred Years War"
 je_england_1_lobby: "The English Crown claims France. Defend its continental foothold and press that claim before the remaining possessions are lost."
 je_england_1_reason: "The Crown still claims the throne of France. Hold land in eight French state regions, directly or through subjects, to secure the claim. The loss of all but two regions ends our continental ambitions."
 je_england_2: "The Wars of the Roses"
 je_england_2_lobby: "Lancaster rules, but York contests the succession. Keep the nobility loyal or face a struggle for the throne."
 je_england_2_reason: "Lancaster holds the throne; York challenges its rule. Noble patronage shifts the succession, while weak government raises Realm Tension. At 60 Tension, a rival house can form a revolutionary movement.\n\nSecure your dynasty after war through 24 consecutive months of low tension and firm support. Lancaster can also avert war through 36 months of peaceful government. The requirements below track a lasting settlement."
 je_england_3: "Unification of Britain"
 je_england_3_lobby: "The British Isles remain divided among rival crowns and lordships. Bring them under one sovereign."
 je_england_3_reason: "Rival crowns and lordships divide the British Isles. Bring every state in Britain and Ireland under direct rule to secure a united realm."
 je_england_colonization_of_canada: "Colonization of Canada"
 je_england_colonization_of_canada_lobby: "England's northern possessions need lasting governments. Establish the Canadian colonies as the Crown's reach expands."
 je_england_colonization_of_canada_reason: "Give our Canadian possessions permanent governments. Charter the five regional colonies as land is acquired. Newfoundland remains under direct rule; the inland fur trade belongs to the separate Hudson’s Bay charter."
 je_england_canada_new_brunswick: "Charter New Brunswick"
 je_england_canada_new_brunswick_desc: "Establish New Brunswick as a British colonial administration."
 je_england_canada_nova_scotia: "Charter Nova Scotia"
 je_england_canada_nova_scotia_desc: "Establish Nova Scotia as a British colonial administration."
 je_england_canada_quebec: "Charter Lower Canada"
 je_england_canada_quebec_desc: "Establish Lower Canada under an Anglo-Canadian colonial administration."
 je_england_canada_ontario: "Charter Upper Canada"
 je_england_canada_ontario_desc: "Establish Upper Canada as a British colonial administration."
 je_england_canada_columbia: "Charter the Columbia District"
 je_england_canada_columbia_desc: "Establish the Columbia District as a British colonial administration after securing Northern Columbia."
