 england_hyw_victory.title: "The Angevin Triumph"
 england_hyw_victory.desc: "English rule and loyal subjects now extend across much of France. The Crown’s old claim has become a credible bid for the French throne."
 england_hyw_victory.flavor: "Across the Channel, heralds proclaim the same king in two languages."
 england_hyw_victory.a: "Our claim stands vindicated."
 hundred_years_war_won: "The Angevin Triumph"

 england_hyw_defeat.title: "The Loss of France"
 england_hyw_defeat.desc: "Our French possessions have dwindled beyond recovery. Defeat leaves the Crown burdened by debt and the magnates questioning its judgement."
 england_hyw_defeat.flavor: "The soldiers return with arrears of pay. The men who sent them have fewer answers."
 england_hyw_defeat.a: "We must rebuild at home."
 hundred_years_war_lost: "The Loss of France"

 england_new_world_canada.title: "The Northern Dominion"
 england_new_world_canada.desc: "Atlantic fishermen report sheltered harbours and a great river leading inland. Merchants seek royal backing for permanent settlements in Canada."
 england_new_world_canada.flavor: "A fishing station needs a season’s supplies. A colony needs years of credit."
 england_new_world_canada.a: "Back the Canadian venture."
 england_new_world_canada.b: "Keep our resources at home."
 canada_expedition: "Canada Expedition"

 england_the_justices_of_peace.title: "The Justices of the Peace"
 england_the_justices_of_peace.desc: "Justices of the Peace enforce royal law in the shires. Strengthening their office would improve local government and weaken the magnates’ influence."
 england_the_justices_of_peace.flavor: "The petition bears a familiar complaint: the lord’s men have broken the peace, and the lord’s court has found no fault."
 england_the_justices_of_peace.a: "Strengthen the justices."
 england_the_justices_of_peace.b: "Leave local justice to the lords."
 england_the_justices_of_peace_a: "Royal Justices"
 england_the_justices_of_peace_b: "Magnates’ Justice"
 england_the_yorkist_tradition.title: "The Yorkist Tradition"
 england_the_yorkist_tradition.desc: "Yorkist councillors favour trained lawyers and clerks for royal office. The nobility objects to seeing its privileges pass to men of humbler birth."
 england_the_yorkist_tradition.flavor: "A pedigree may secure an audience. It cannot balance the accounts."
 england_the_yorkist_tradition.a: "Appoint men of learning."
 england_the_yorkist_tradition.b: "Reserve office for the nobility."
 england_the_yorkist_tradition_a: "Yorkist Administrators"
 england_the_yorkist_tradition_b: "Hereditary Officeholders"

 england_war_of_the_roses_start.title: "The Cousins' Quarrel"
 england_war_of_the_roses_start.desc: "The Lancastrian court holds the Crown, but the House of York gathers allies against its government. Each disputed appointment gives the great lords another reason to take sides."
 england_war_of_the_roses_start.flavor: "At Westminster, retainers wait outside while their masters count the men within."
 england_war_of_the_roses_start.a: "Keep the king’s peace."
 england_war_of_the_roses_lancaster.title: "Lancaster Secure"
 england_war_of_the_roses_lancaster.desc: "The Lancastrian order has survived the challenge of its rivals. By binding the magnates to the Crown and restoring the dignity of royal government, England has drawn the teeth from the Yorkist cause."
 england_war_of_the_roses_lancaster.flavor: "The lords came one by one, some smiling, some silent, all kneeling. The kingdom had not forgotten its wounds, but for the first time in years the court dared to call them closed."
 england_war_of_the_roses_lancaster.a: "The red rose endures."

 england_war_of_the_roses_york.title: "The Sun in Splendour"
 england_war_of_the_roses_york.desc: "The Yorkist affinity has prevailed over the old Lancastrian court. With the backing of soldiers, administrators, and nobles weary of misrule, England turns toward a more disciplined monarchy."
 england_war_of_the_roses_york.flavor: "At dawn the banners were raised above London, white rose and bright sun catching the same pale light. Those who had waited in uncertainty now hurried to declare that they had never doubted."
 england_war_of_the_roses_york.a: "The white rose rises."
 england_war_of_the_roses_realm_arms.title: "The Realm Arms Itself"
 england_war_of_the_roses_realm_arms.desc: "Retainers gather beneath private badges, sheriffs hesitate to enforce royal writs, and the great houses measure one another openly. Unless the Crown can impose a settlement, faction may soon become civil war."
 england_war_of_the_roses_realm_arms.flavor: "Every road out of London seems to carry messengers, liveried men, and rumor. In the shires, old quarrels have found new banners."
 england_war_of_the_roses_realm_arms.a: "Summon the lords to council."
 england_war_of_the_roses_realm_arms.b: "Let loyal affinities prepare."
 england_war_of_the_roses_cade.title: "The Commons of Kent"
 england_war_of_the_roses_cade.desc: "Discontent in Kent has crystallized around demands for lawful government, honest officials, and relief from the failures of royal policy. Though the rising speaks in the name of reform, many at court hear the voice of York behind it."
 england_war_of_the_roses_cade.flavor: "Petitions arrive by the handful, written with the confidence of men who believe the kingdom has forgotten them and with the anger of men willing to remind it."
 england_war_of_the_roses_cade.a: "Hear their complaints."
 england_war_of_the_roses_cade.b: "Break the disorder."
 england_war_of_the_roses_protectorate.title: "The Duke's Protectorate"
 england_war_of_the_roses_protectorate.desc: "The Duke of York and his allies press for a protectorate over the realm, claiming that only firm and reforming authority can restore order while the Crown falters. To accept would steady the kingdom at the cost of Lancastrian prestige; to refuse may force every lord to choose a side."
 england_war_of_the_roses_protectorate.flavor: "The request is phrased as service, the ceremony as loyalty, and the implication as plain as a drawn blade."
 england_war_of_the_roses_protectorate.a: "Name York Protector."
 england_war_of_the_roses_protectorate.b: "The Crown needs no protector."
 england_war_of_the_roses_livery.title: "Livery and Maintenance"
 england_war_of_the_roses_livery.desc: "Across the shires, magnates distribute badges, retain armed households, and bind lesser gentry into private affinities. These liveried men claim to defend order, but every household troop makes the King's peace look more fragile."
 england_war_of_the_roses_livery.flavor: "A badge sewn onto a sleeve may be called loyalty. A hundred such sleeves gathered in a market town are something else."
 england_war_of_the_roses_livery.a: "Restrict private livery."
 england_war_of_the_roses_livery.b: "The great lords must keep their men."
 england_war_of_the_roses_queen_party.title: "The Queen's Party"
 england_war_of_the_roses_queen_party.desc: "A circle of Lancastrian loyalists gathers around the Queen, arguing that the Crown must reward those who stand firm against Yorkist ambition. Their enemies see not loyalty, but exclusion, favoritism, and the hardening of court politics."
 england_war_of_the_roses_queen_party.flavor: "The court speaks in careful voices, but everyone knows which doors open for which names."
 england_war_of_the_roses_queen_party.a: "Trust the Queen's allies."
 england_war_of_the_roses_queen_party.b: "Broaden the King's council."
 england_war_of_the_roses_warwick.title: "The Earl of Warwick"
 england_war_of_the_roses_warwick.desc: "Richard Neville, Earl of Warwick, commands wealth, ships, retainers, and a talent for binding men to his cause. Yorkist reformers court him eagerly, while the court fears that such a lord may become too powerful to manage."
 england_war_of_the_roses_warwick.flavor: "Some lords bring counsel to court. Warwick brings ships, retainers, and enough friends to make every counsel sound like a summons."
 england_war_of_the_roses_warwick.a: "Win Warwick's support."
 england_war_of_the_roses_warwick.b: "Check his ambition."
 england_war_of_the_roses_st_albans.title: "First Blood at St Albans"
 england_war_of_the_roses_st_albans.desc: "The quarrel has spilled into armed confrontation. Blood in the streets has transformed grievance into vengeance, and every noble house now studies the lesson: the King's peace can be broken."
 england_war_of_the_roses_st_albans.flavor: "No herald proclaimed the end of peace. It ended in shouting, smoke, and men recognizing their neighbors beneath enemy badges."
 england_war_of_the_roses_st_albans.a: "Accept York's demands for reform."
 england_war_of_the_roses_st_albans.b: "Attaint the rebels."
 england_war_of_the_roses_loveday.title: "The Loveday"
 england_war_of_the_roses_loveday.desc: "The Crown proposes a public reconciliation between the rival lords. A solemn procession, compensation for the dead, and oaths sworn before God may still persuade the kingdom that peace is possible."
 england_war_of_the_roses_loveday.flavor: "Hand in hand, enemies walk through London while the crowd tries to decide whether it is witnessing mercy or theater."
 england_war_of_the_roses_loveday.a: "Stage the reconciliation."
 england_war_of_the_roses_loveday.b: "Empty ceremony will not bind them."
 england_war_of_the_roses_attainders.title: "Bills of Attainder"
 england_war_of_the_roses_attainders.desc: "Parliament may be used to strip the Crown's enemies of lands, offices, and inheritance. Such punishment would strengthen the victorious faction, but every attainder teaches the defeated that compromise offers no safety."
 england_war_of_the_roses_attainders.flavor: "Ink can confiscate what swords have not yet taken."
 england_war_of_the_roses_attainders.a: "Make treason costly."
 england_war_of_the_roses_attainders.b: "Offer pardons instead."
 england_war_of_the_roses_accord.title: "The Act of Accord"
 england_war_of_the_roses_accord.desc: "Parliament proposes that Henry VI retain the Crown for life, but that Richard of York and his heirs succeed him. It is a lawyer's answer to a soldier's quarrel: precise, solemn, and certain to dispossess the Prince of Wales."
 england_war_of_the_roses_accord.flavor: "The parchment promises peace by deciding who shall inherit the war."
 england_war_of_the_roses_accord.a: "Recognize York as heir to the throne."
 england_war_of_the_roses_accord.b: "The Prince of Wales will not be disinherited."
 england_war_of_the_roses_wakefield.title: "Wakefield"
 england_war_of_the_roses_wakefield.desc: "York's enemies gather in the north. The duke may march from Sandal Castle to confront them, staking his life and claim upon battle, or remain close to the royal court and preserve the uneasy constitutional settlement."
 england_war_of_the_roses_wakefield.flavor: "From Sandal Castle, the duke can see his enemies gathering. His councillors urge caution."
 england_war_of_the_roses_wakefield.a: "York must take the field, whatever the risk."
 england_war_of_the_roses_wakefield.b: "The succession is too precious to hazard."
 england_war_of_the_roses_kingmaker.title: "The Kingmaker's Price"
 england_war_of_the_roses_kingmaker.desc: "Warwick expects the new Yorkist order to be governed through the alliances and affinities that placed it upon the throne. The King, however, has a household, favorites, and a will of his own."
 england_war_of_the_roses_kingmaker.flavor: "The man who helped make a king has begun to wonder whether he can unmake one."
 england_war_of_the_roses_kingmaker.a: "Warwick shall remain first among our servants."
 england_war_of_the_roses_kingmaker.b: "A king does not reign by another man's permission."
 england_war_of_the_roses_readeption.title: "The Readeption"
 england_war_of_the_roses_readeption.desc: "Warwick has turned against the dynasty he raised. Lancastrian exiles gather around him, and the old king's name is again spoken as a weapon against York. England faces restoration, not reconciliation."
 england_war_of_the_roses_readeption.flavor: "Yesterday's traitor arrives beneath yesterday's royal banner and calls the transformation loyalty."
 england_war_of_the_roses_readeption.a: "Open negotiations with the Lancastrian lords."
 england_war_of_the_roses_readeption.b: "Proclaim Warwick a traitor."
 england_war_of_the_roses_princes.title: "The Princes in the Tower"
 england_war_of_the_roses_princes.desc: "The Yorkist succession is in dispute. Gloucester seeks the protectorate and the Crown; protecting Edward’s sons would preserve their inheritance but leave their rivals at court."
 england_war_of_the_roses_princes.flavor: "The Tower was built to guard kings. Now England wonders whom it guards, and from whom."
 england_war_of_the_roses_princes.a: "Richard must secure the realm."
 england_war_of_the_roses_princes.b: "Protect Edward's sons and their inheritance."
 england_war_of_the_roses_tudor_claimant.title: "The Last Lancastrian Claim"
 england_war_of_the_roses_tudor_claimant.desc: "Henry Tudor, descended through the Beaufort line and hardened by exile, has gathered Welsh supporters, Lancastrian survivors, and Yorkists alienated by the new reign. His blood claim is thin; his promise to end the quarrel is not."
 england_war_of_the_roses_tudor_claimant.flavor: "Across the sea, an exile measures a crown whose strongest jewel is the exhaustion of everyone who opposes him."
 england_war_of_the_roses_tudor_claimant.a: "Meet the exile with the whole strength of the Crown."
 england_war_of_the_roses_tudor_claimant.b: "Offer pardon before he lands."
 england_war_of_the_roses_civil_war.title: "The Banners Unfurled"
 england_war_of_the_roses_civil_war.desc: "The claimant movement has passed beyond petitions and private musters. A rival government now commands shires, regiments, and revenues in the name of another dynasty. The quarrel of cousins has become a war for England."
 england_war_of_the_roses_civil_war.flavor: "Red rose, white rose, and the badges of a hundred lords move down the same muddy roads."
 england_war_of_the_roses_civil_war.a: "There can be only one Crown."
 england_war_of_the_roses_lancaster_restored.title: "The Red Rose Restored"
 england_war_of_the_roses_lancaster_restored.desc: "Lancastrian armies have broken their rivals and restored their claimant to the throne. The dynasty possesses England again, but attainders, exiles, and Yorkist blood claims ensure that victory is not yet the same thing as peace."
 england_war_of_the_roses_lancaster_restored.flavor: "The old banners return to Westminster, patched where necessary and carried as though they had never fallen."
 england_war_of_the_roses_lancaster_restored.a: "Restore the Lancastrian court."
 england_war_of_the_roses_york_accession.title: "The Sun in Splendour"
 england_war_of_the_roses_york_accession.desc: "The Yorkist claimant has won the field and entered London as king. Soldiers and reforming councillors celebrate the end of Lancastrian misrule, while defeated nobles carry their loyalty into exile."
 england_war_of_the_roses_york_accession.flavor: "Above the victorious host, the sun breaks through and every chronicler immediately understands the omen."
 england_war_of_the_roses_york_accession.a: "Crown the Yorkist claimant."
 england_war_of_the_roses_tudor_victory.title: "Bosworth Field"
 england_war_of_the_roses_tudor_victory.desc: "The last charge has failed and the Crown has changed hands upon the battlefield. Henry Tudor claims England as Henry VII, promising to join the rival inheritances and end the cycle of private war."
 england_war_of_the_roses_tudor_victory.flavor: "A circlet recovered from the field is lifted above an exile's head. The age of the Plantagenets ends in mud, steel, and exhausted silence."
 england_war_of_the_roses_tudor_victory.a: "The red and white roses shall be joined."
 england_war_of_the_roses_crown_victory.title: "The Crown Holds"
 england_war_of_the_roses_crown_victory.desc: "The claimant's government has collapsed and the royal host has prevailed. The reigning dynasty has survived another armed challenge, though the confiscations and graves left behind will shape the next peace."
 england_war_of_the_roses_crown_victory.flavor: "The victors call it the restoration of order. The defeated call it an interlude."
 england_war_of_the_roses_crown_victory.a: "The King's peace will be enforced."
