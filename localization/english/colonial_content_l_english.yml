l_english:
 je_colonial_administration: "Establish Colonial Administration"
 je_colonial_administration_reason: "Place regional possessions under a colonial government. It can receive our other holdings in the region and expand into neighbouring decentralized territory under its colonial laws."
 je_colonial_administration_button_senegal: "Establish Colony in [SCOPE.sStateRegion('senegal_region_scope').GetStrategicRegion.GetName]"
 je_colonial_administration_button_senegal_desc: "The western coast of Africa offers valuable agricultural land, tropical crops, and access to major trade routes crossing the Atlantic."

 je_colonial_administration_button_zanj: "Establish Colony in [SCOPE.sStateRegion('zanj_region_scope').GetStrategicRegion.GetName]"
 je_colonial_administration_button_zanj_desc: "East Africa controls vital trade routes linking the Indian Ocean with the African interior. Ivory, spices, and valuable resources flow through its ports."

 je_colonial_administration_button_southern_africa: "Establish Colony in [SCOPE.sStateRegion('southern_africa_region_scope').GetStrategicRegion.GetName]"
 je_colonial_administration_button_southern_africa_desc: "Southern Africa contains vast mineral wealth, fertile grasslands, and strategic ports controlling access between the Atlantic and Indian Oceans."

 je_colonial_administration_button_congo: "Establish Colony in [SCOPE.sStateRegion('congo_region_scope').GetStrategicRegion.GetName]"
 je_colonial_administration_button_congo_desc: "The Congo Basin contains immense forests, rivers, and untapped resources that can fuel industrial growth and imperial ambitions."

 je_colonial_administration_button_canada: "Establish Colony in [SCOPE.sStateRegion('canada_region_scope').GetStrategicRegion.GetName]"
 je_colonial_administration_button_canada_desc: "Canada's forests, fisheries, and frontier settlements provide vast opportunities for expansion and economic development."

 je_colonial_administration_button_atlantic_coast: "Establish Colony in [SCOPE.sStateRegion('atlantic_coast_region_scope').GetStrategicRegion.GetName]"
 je_colonial_administration_button_atlantic_coast_desc: "The Atlantic Coast contains thriving ports, fertile farmland, and serves as the gateway between Europe and the New World."

 je_colonial_administration_button_pacific_coast: "Establish Colony in [SCOPE.sStateRegion('pacific_coast_region_scope').GetStrategicRegion.GetName]"
 je_colonial_administration_button_pacific_coast_desc: "Rich in timber, fisheries, and trade potential, the Pacific Coast opens access to the markets of Asia and the Pacific."

 je_colonial_administration_button_great_plains: "Establish Colony in [SCOPE.sStateRegion('great_plains_region_scope').GetStrategicRegion.GetName]"
 je_colonial_administration_button_great_plains_desc: "The Great Plains offer vast agricultural potential, grazing land, and room for rapid settler expansion."

 je_colonial_administration_button_central_america: "Establish Colony in [SCOPE.sStateRegion('central_america_region_scope').GetStrategicRegion.GetName]"
 je_colonial_administration_button_central_america_desc: "Central America commands strategic trade routes between two oceans and produces valuable tropical goods."

 je_colonial_administration_button_gran_colombia: "Establish Colony in [SCOPE.sStateRegion('gran_colombia_region_scope').GetStrategicRegion.GetName]"
 je_colonial_administration_button_gran_colombia_desc: "Northern South America is rich in agricultural land, precious resources, and important Caribbean trade connections."

 je_colonial_administration_button_andes: "Establish Colony in [SCOPE.sStateRegion('andes_region_scope').GetStrategicRegion.GetName]"
 je_colonial_administration_button_andes_desc: "The Andes contain rich mineral deposits, productive highlands, and long-established centers of commerce."

 je_colonial_administration_button_la_plata: "Establish Colony in [SCOPE.sStateRegion('la_plata_region_scope').GetStrategicRegion.GetName]"
 je_colonial_administration_button_la_plata_desc: "La Plata possesses fertile plains, abundant livestock, and access to the great river systems of southern South America."

 je_colonial_administration_button_brazil: "Establish Colony in [SCOPE.sStateRegion('brazil_region_scope').GetStrategicRegion.GetName]"
 je_colonial_administration_button_brazil_desc: "Brazil combines immense agricultural potential, tropical resources, and one of the largest coastlines in the world."

 je_colonial_administration_button_cape_verde: "Establish Island Colony in Cape Verde"
 je_colonial_administration_button_cape_verde_desc: "Cape Verde is small, distant, and strategically placed. A dedicated island administration will keep it useful without tying it directly to the metropole."

 je_colonial_administration_button_tt_1: "When establishing a local colonial administration, we will be able to tailor its [Concept('concept_law', '$concept_laws$')] and [concept_government] to best suit the needs of the metropole, and its constituent [Concept('concept_interest_group','$concept_interest_groups$')]."
 je_colonial_administration_button_tt_2: "Any [SCOPE.GetRootScope.GetCountry.GetAdjective] lands within the relevant [concept_strategic_region] will be transferred to our new colonial [concept_subject]. If a [concept_state] has the [GetDecreeType('decree_greener_grass_campaign').GetName] [concept_decree], a random state with that decree will be designated as its capital."

 je_colonial_administration_button_expand_senegal: "Expand Our Colony in [SCOPE.sStateRegion('senegal_region_scope').GetStrategicRegion.GetName]"
 je_colonial_administration_button_expand_senegal_desc: "We currently hold lands in [SCOPE.sStateRegion('senegal_region_scope').GetStrategicRegion.GetName] that would be better administered by our colonial subject. If we have more than one colonial [concept_subject] in this [concept_strategic_region], they will be merged together."

