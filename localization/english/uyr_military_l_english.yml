 ship_type_xebec: "Xebec"
 ship_type_archipelago_frigate: "Archipelago Frigate"

  # Heavy Ships
 ship_group_heavy: "Heavy Ships"
 ship_group_heavy_desc: "Heavy ships are the backbone of any battle fleet. Combining powerful broadsides with exceptional durability, they dominate naval engagements and serve as the fleet's primary damage dealers."

