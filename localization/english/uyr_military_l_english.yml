l_english:
 combat_unit_group_levy: "Conscripts"
 # Light Infantry
 combat_unit_group_light_infantry: "Light Infantry"
 combat_unit_type_levy: "Levy"
 combat_unit_type_light_infantry_1: "Archer"
 combat_unit_type_light_infantry_1_desc: "Bowmen carry spare strings and sheaves of arrows, loosing before the opposing ranks close."
 combat_unit_type_light_infantry_2: "Crossbowman"
 combat_unit_type_light_infantry_2_desc: "Crossbowmen span their bows behind shields or cover, then step out to loose a short, heavy bolt."
 combat_unit_type_light_infantry_3: "Handgonner"
 combat_unit_type_light_infantry_3_desc: "Handgonners brace their short barrels and touch a smoldering match to the vent."
 combat_unit_type_light_infantry_4: "Arquebusier"
 combat_unit_type_light_infantry_4_desc: "Arquebusiers carry their slow matches lit on the march into battle, keeping the glowing ends clear of their powder."
 combat_unit_type_light_infantry_5: "Skirmisher"
 combat_unit_type_light_infantry_5_desc: "Skirmishers spread out ahead of the battalion, firing from cover and retiring as the line comes up."
 combat_unit_type_light_infantry_6: "Rifleman"
 combat_unit_type_light_infantry_6_desc: "Riflemen take deliberate aim from broken ground, where small parties can choose their own targets."

 combat_unit_type_england_longbowman: "Longbowman"
 combat_unit_type_england_longbowman_desc: "English archers set spare shafts within reach and loose their first volleys as the enemy comes into range."
 combat_unit_type_england_elite_longbowman: "Elite Longbowman"
 combat_unit_type_england_elite_longbowman_desc: "Veteran bowmen judge the ground and pace of a charge, husbanding their arrows until their captains give the word."

 # Heavy Infantry
 combat_unit_group_heavy_infantry: "Heavy Infantry"
 combat_unit_type_heavy_infantry_1: "Footman"
 combat_unit_type_heavy_infantry_1_desc: "Footmen stand shoulder to shoulder with spears and shields, their padded coats bearing the wear of the march."
 combat_unit_type_heavy_infantry_2: "Man-at-Arms"
 combat_unit_type_heavy_infantry_2_desc: "Men-at-arms fight dismounted in plate harness, wielding swords and poleaxes in the press of the line."
 combat_unit_type_heavy_infantry_3: "Halberdier"
 combat_unit_type_heavy_infantry_3_desc: "Halberdiers thrust, chop, and hook with the same long weapon, often standing near the colors."
 combat_unit_type_heavy_infantry_4: "Pikeman"
 combat_unit_type_heavy_infantry_4_desc: "Pikemen plant their feet and lower a hedge of points, giving the shot shelter when horsemen approach."
 combat_unit_type_heavy_infantry_5: "Musketeer"
 combat_unit_type_heavy_infantry_5_desc: "Musketeers load and fire by command, the smoke of one volley scarcely clearing before the next rank presents."
 combat_unit_type_heavy_infantry_6: "Fusilier"
 combat_unit_type_heavy_infantry_6_desc: "Fusiliers carry flintlocks and bayonets, closing their ranks as drums beat the advance."

 # Light Cavalry
 combat_unit_group_light_cavalry: "Light Cavalry"
 combat_unit_type_light_cavalry_1: "Horseman"
 combat_unit_type_light_cavalry_1_desc: "Lightly equipped riders range ahead of the host, watching river crossings and the roads through wooded country."
 combat_unit_type_light_cavalry_2: "Cavalryman"
 combat_unit_type_light_cavalry_2_desc: "Mounted troopers carry orders between columns and keep watch on the enemy's movements beyond the camp."
 combat_unit_type_light_cavalry_3: "Light Lancer"
 combat_unit_type_light_cavalry_3_desc: "Light lancers ride with little armor, carrying their spears on patrol and following up a broken line."
 combat_unit_type_light_cavalry_4: "Pistoleer"
 combat_unit_type_light_cavalry_4_desc: "Pistoleers draw their weapons from saddle holsters before closing within pistol shot."
 combat_unit_type_light_cavalry_5: "Hussar"
 combat_unit_type_light_cavalry_5_desc: "Hussars ride in light order with curved sabers, scouting the enemy's roads and taking stragglers on the retreat."
 combat_unit_type_light_cavalry_6: "Light Dragoon"
 combat_unit_type_light_cavalry_6_desc: "Light dragoons patrol on horseback and can dismount with their carbines when the ground requires it."

 # Heavy Cavalry
 combat_unit_group_heavy_cavalry: "Heavy Cavalry"
 combat_unit_type_heavy_cavalry_1: "Armored Horseman"
 combat_unit_type_heavy_cavalry_1_desc: "Mail-clad riders muster with shields and lances on horses bred and kept for war."
 combat_unit_type_heavy_cavalry_2: "Armored Cavalryman"
 combat_unit_type_heavy_cavalry_2_desc: "Armored cavalrymen ride in fitted plate, ready to charge in close company under their captain's banner."
 combat_unit_type_heavy_cavalry_3: "Lancer"
 combat_unit_type_heavy_cavalry_3_desc: "Lancers lower their ash shafts together as the squadron closes on the enemy."
 combat_unit_type_heavy_cavalry_4: "Heavy Lancer"
 combat_unit_type_heavy_cavalry_4_desc: "Heavy lancers keep their breastplates and long weapons, seeking a decision in the first charge."
 combat_unit_type_heavy_cavalry_5: "Gallop Cavalry"
 combat_unit_type_heavy_cavalry_5_desc: "Sword in hand, the squadron quickens to a gallop for the last stretch of its charge."
 combat_unit_type_heavy_cavalry_6: "Cuirassier"
 combat_unit_type_heavy_cavalry_6_desc: "Cuirassiers ride in heavy squadrons with steel breastplates and long, straight swords."

 # Artillery
 combat_unit_type_artillery_1: "Trebuchet"
 combat_unit_type_artillery_1_desc: "A crew of carpenters and laborers works the counterweight and sling that cast stones against a fortified place."
 combat_unit_type_artillery_2: "Houfnice"
 combat_unit_type_artillery_2_desc: "Crews of these early field guns take their place beside the wagons and infantry of the host."
 combat_unit_type_artillery_3: "Falconet"
 combat_unit_type_artillery_3_desc: "Falconet crews work a small, light piece that can be brought forward where heavier guns would be difficult to move."
 combat_unit_type_artillery_4: "Chambered Cannon"
 combat_unit_type_artillery_4_desc: "Gunners serve a piece with a separate powder chamber, locking the loaded chamber against the breech."
 combat_unit_type_artillery_5: "Royal Mortar"
 combat_unit_type_artillery_5_desc: "Mortar crews bed their pieces low and lob shells over parapets into the works behind them."
 combat_unit_type_artillery_6: "Flying Battery"
 combat_unit_type_artillery_6_desc: "The gunners ride with their limbered pieces and dismount to bring the battery into action."

 # Logistics
 combat_unit_type_logistics_1: "Camp Follower"
 combat_unit_type_logistics_2: "Supply Cart"
 combat_unit_type_logistics_3: "Supply Convoy"
 combat_unit_type_logistics_4: "Baggage Train"
 combat_unit_type_logistics_5: "Wagon Train"
 combat_unit_type_logistics_6: "Logistics Corps"

  # Galleys
 ship_group_galley: "Galleys"
 ship_group_galley_desc: "Galleys sacrifice durability for overwhelming offensive power. Deadly in coastal waters and inland seas, they excel at delivering devastating attacks but rely on screening and favorable conditions to survive."

