l_english:
 colonial_rush: "Colonial Mobilization"
 colonization_rush.t: "The Colonial Question"
 colonization_rush.d: "New navigation, finance, and settlement techniques have made sustained overseas expansion possible. Merchants and courtiers urge the state to commit itself before rival powers seize the most valuable routes."
 colonization_rush.f: "Across the ocean lie harbors, markets, and lands still unknown to our court. Reaching them will demand ships, settlers, money, and political resolve."
 colonization_rush.a: "Commit the realm to overseas expansion"
 colonization_rush.b: "Our ambitions lie elsewhere"

 national_colonization.1.t: "The Enterprise of the Indies"
 national_colonization.1.d: "Sailors and cosmographers propose a western passage into the Ocean Sea. Before any conquest of the continental empires can be attempted, the Crown must establish secure harbors among the Caribbean islands and make them the base of a permanent transatlantic enterprise."
 national_colonization.1.f: "The islands will be the gateway: first anchorages and settlements, then expeditions toward the mainland."
 national_colonization.1.a: "Open the Caribbean route"
 national_colonization.1.b: "The Crown will not finance this venture"

 national_colonization.2.t: "Beyond Cape Bojador"
 national_colonization.2.d: "Portuguese mariners have learned to work their way down the Atlantic coast of Africa. A chain of fortified harbors and trading stations could secure gold, commerce, and the sea route around Africa, laying the foundation of a maritime empire."
 national_colonization.2.f: "The way forward is not a single conquest, but a road of islands, capes, factories, and ports stretching ever farther south."
 national_colonization.2.a: "Carry the voyages down the African coast"
 national_colonization.2.b: "The oceanic enterprise is too costly"

 national_colonization.3.t: "The Voyages of Cartier"
 national_colonization.3.d: "With our knowledge of the New World, organized settlement, and Atlantic trade now sufficiently developed, the northern ocean lies open. An expedition through Newfoundland and the Gulf of Saint Lawrence could find a passage to Asia—or establish a French claim to a vast northern dominion."
 national_colonization.3.f: "Beyond the fishing banks, the great river leads inland toward forests, furs, and the possibility of a New France."
 national_colonization.3.a: "Send an expedition to Canada"
 national_colonization.3.b: "France has more urgent concerns"

 national_colonization.4.t: "From the Islands to the Mainland"
 national_colonization.4.d: "Our Caribbean settlements now provide secure harbors, supplies, and experienced crews. Expeditions can cross the narrow sea and establish a permanent foothold upon the American mainland."
 national_colonization.4.f: "The islands were the gateway. Beyond them waits a continent."
 national_colonization.4.a: "Prepare the mainland expeditions"

 national_colonization.5.t: "Beyond New Spain"
 national_colonization.5.d: "Our position on the mainland is secure enough to support expeditions farther south. New routes now lead toward the rich kingdoms and ports of northern South America and the Andes."
 national_colonization.5.f: "Each new harbor carries the frontier farther beyond the horizon."
 national_colonization.5.a: "Extend the enterprise southward"

 national_colonization.6.t: "Toward the Southern Cone"
 national_colonization.6.d: "With strong bases in northern South America and the Andes, our navigators and governors now look toward the great estuary and plains of the distant south."
 national_colonization.6.f: "The imperial road now stretches from the Caribbean toward the ends of the continent."
 national_colonization.6.a: "Open the route to La Plata"

 national_colonization.7.t: "The Western Route Opens"
 national_colonization.7.d: "Our chain of African stations has trained a generation of ocean-going navigators. The winds and currents now reveal a western route toward the vast lands across the Atlantic."
 national_colonization.7.f: "The road around Africa begins by sailing west."
 national_colonization.7.a: "Turn toward Brazil"

 national_colonization.8.t: "Around the Cape"
 national_colonization.8.d: "Atlantic bases on both shores give our fleets the reach and experience required for the longer road around southern Africa and onward toward India."
 national_colonization.8.f: "Cape by cape, harbor by harbor, the ocean becomes a Portuguese road."
 national_colonization.8.a: "Carry the enterprise into the Indian Ocean"

 national_colonization.9.t: "The Saint Lawrence Foothold"
 national_colonization.9.d: "Permanent settlements in Canada can now provision voyages farther down the North American coast. Merchants and officers propose extending the French Atlantic beyond the great river."
 national_colonization.9.f: "New France will not remain confined to a single shore."
 national_colonization.9.a: "Expand along the Atlantic coast"

 national_colonization.10.t: "A Wider French Atlantic"
 national_colonization.10.d: "Our North American settlements and ports have created a durable Atlantic network. French merchants now press for access to the warmer islands and markets of the Caribbean."
 national_colonization.10.f: "From the Saint Lawrence to the Antilles, French sails cross the western ocean."
 national_colonization.10.a: "Enter the Caribbean contest"

 geographic_region_aoc_spanish_caribbean: "Spanish Caribbean"
 geographic_region_aoc_spanish_mainland: "Spanish Main"
