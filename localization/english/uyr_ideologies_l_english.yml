l_english:

 ideology_aristocracy: "Aristocracy"
 ideology_aristocracy_desc: "The ancient houses claim the right to hold court, command the host, and advise the sovereign. These duties and dignities pass with their estates."

 ideology_plutocratic: "Plutocratic"
 ideology_plutocratic_desc: "Those who furnish the loans and pay the customs expect a voice in council. To the men of property, a substantial fortune is proof of standing."

 ideology_decentralization: "Decentralization"
 ideology_decentralization_desc: "Each province has its own laws, charters, and courts. The capital must seek the consent of the estates in matters beyond its own jurisdiction."

 ideology_centralization: "Centralization"
 ideology_centralization_desc: "A single administration should keep the registers and issue the ordinances of the realm. Local officers should answer to the capital for their conduct."

 ideology_serfdom: "Serfdom"
 ideology_serfdom_desc: "The manor is bound together by obligations inherited with the land. The lord claims the customary service of the households that work his estate."

 ideology_free_subjects: "Free Subjects"
 ideology_free_subjects_desc: "Rent may be owed for a holding, but the person who works it should be free to leave, bargain for wages, or hold land in their own right."

 ideology_aoc_traditionalist: "Traditionalist"
 ideology_aoc_traditionalist_desc: "The customs of the people are kept in local courts, households, and places of worship. What has been handed down commands a respect that a new ordinance must earn."

 ideology_innovative: "Innovative"
 ideology_innovative_desc: "The useful arts advance by trial, observation, and the exchange of discoveries. Schools and workshops should make room for new methods of inquiry."

 ideology_liberalism: "Liberalism"
 ideology_liberalism_desc: "Public authority should be bound by law and answerable to representatives. Subjects may assemble and put their grievances into print."

 ideology_absolutism: "Absolutism"
 ideology_absolutism_desc: "The offices of the realm derive their authority from the sovereign. Neither chartered borough nor hereditary estate may claim a jurisdiction beyond the throne's reach."

 ideology_outward: "Expansionist"
 ideology_outward_desc: "Merchants and settlers petition for charters abroad, where new posts and settlements might carry the realm's claims beyond its present borders."

 ideology_inward: "Isolationist"
 ideology_inward_desc: "The realm should tend to its own provinces and guard the terms on which foreign merchants enter its markets. Settlements abroad are a charge the country need never take on."

 ideology_capital_economy: "Capital Economy"
 ideology_capital_economy_desc: "Merchants and investors should be free to commit their capital where they judge it best employed. Private contracts take the place of obligations inherited with the land."

 ideology_traditional_economy: "Traditional Economy"
 ideology_traditional_economy_desc: "The trades of the town and the husbandry of the countryside are governed by custom. In workshop and market, chartered bodies defend the rights of those who practise a calling."

 ideology_spiritualist: "Spiritualist"
 ideology_spiritualist_desc: "Public authority has a duty to uphold the established faith. Its institutions are entrusted with teaching, worship, and the care of their communities."

 ideology_humanist: "Humanist"
 ideology_humanist_desc: "Conscience is beyond the reach of the magistrate. People of different faiths and customs should be able to pursue learning and take part in public life."

 ideology_quality: "Military Quality"
 ideology_quality_desc: "The host should have a permanent body of soldiers trained in drill and led by officers who know their men and their arms."

 ideology_quantity: "Military Quantity"
 ideology_quantity_desc: "The strength of the host lies in the breadth of its muster. The towns and countryside should both be called upon to furnish men."

 ideology_individualism: "Individualism"
 ideology_individualism_desc: "A household should be free to take a holding in its own name, choose an occupation, and bargain for the fruits of its work."

 ideology_communalism: "Communalism"
 ideology_communalism_desc: "The village claims a common right to the pasture and a common voice in its affairs. Those who work the land should settle its use among themselves."

 ideology_aoc_royalist: "Royalist"
 ideology_aoc_royalist_desc: "The Crown belongs to a lawful dynasty. The bond between sovereign and subjects endures when ministers, councils, and estates change."


 ideology_aoc_slaver: "Pro-Slavery"
 ideology_aoc_slaver_desc: "Slaveholders claim their ownership of enslaved people as a right of property and demand that the courts uphold it."

 ideology_aoc_abolitionist: "Abolitionist"
 ideology_aoc_abolitionist_desc: "No court should recognize a claim of ownership over another person. Those held in bondage are entitled to their freedom."

 ideology_mercantilism: "Mercantilism"
 ideology_mercantilism_desc: "The sovereign should reserve valuable routes to chartered companies and use customs duties to keep the gains of trade within the realm."

 ideology_free_Trade: "Free Trade"
 ideology_free_Trade_desc: "Merchants should be free to buy and sell wherever they find a market. Exclusive charters and protective duties serve the few who hold them."

 ideology_belligerent: "Belligerent"
 ideology_belligerent_desc: "The captains urge the sovereign to take the field. They look to the muster and the magazine as the first business of government."

 ideology_conciliatory: "Conciliatory"
 ideology_conciliatory_desc: "Councillors and petitioners urge the sovereign to seek terms before calling out the host. The country arms itself to keep its own peace."

 ideology_aoc_toleration: "Toleration"
 ideology_aoc_toleration_desc: "Dissenting congregations seek the right to keep their rites, appoint their ministers, and worship openly under the protection of the law."

 ideology_aoc_local_privileges: "Local Privileges"
 ideology_aoc_local_privileges_desc: "Communities petition to keep their customs, their own courts, and the liberties set down in their charters."
