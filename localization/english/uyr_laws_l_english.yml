 lawgroup_education_of_masses: "Education of the Masses"
 lawgroup_education_of_masses_desc: "The customs and institutions by which ordinary people receive religious, practical, literary, and civic instruction."

 # EDUCATION OF THE MASSES #

 law_uneducated_masses: "Uneducated Masses"
 law_uneducated_masses_desc: "Books and tutors belong chiefly to courts, religious houses, and wealthy households. Most children learn their calling at home or at work."

 law_religious_teachings: "Religious Teachings"
 law_religious_teachings_desc: "Parishes, mosques, temples, and other religious institutions provide elementary instruction, teaching literacy through sacred texts while placing education under clerical guidance."

 law_devout_education: "Clerical Education"
 law_devout_education_desc: "Formal schooling is entrusted to a privileged religious establishment. Doctrine, discipline, and the training of clergy shape both the curriculum and access to learning."

 law_individual_apprenticeships: "Individual Apprenticeships"
 law_individual_apprenticeships_desc: "Education is arranged through private agreements between masters, families, and pupils. Practical skill and trade knowledge take precedence over universal schooling."

 law_oral_tradition: "Oral Tradition"
 law_oral_tradition_desc: "Communities preserve law, memory, belief, and practical knowledge through recitation, song, storytelling, and instruction by elders rather than through written schools."

 law_personal_religious_education: "Household Religious Education"
 law_personal_religious_education_desc: "Families and local tutors are responsible for teaching literacy and faith, making education a personal religious duty rather than a public institution."

 law_epic_tradition: "Epic Tradition"
 law_epic_tradition_desc: "History, ethics, lineage, and communal identity are taught through memorized epics and learned recitation, preserving knowledge across generations without a broad school system."

 law_secular_education: "Secular Education"
 law_secular_education_desc: "Schools organized by civic or state authorities teach literacy, calculation, and practical knowledge independently of clerical control."

 law_vedic_education: "Vedic Education"
 law_vedic_education_desc: "Learning is organized around teachers and religious schools devoted to sacred texts, philosophy, grammar, ritual, and classical scholarship."


 # RECRUITMENT SYSTEM #

 law_expanded_levies: "Expanded Levies"
 law_expanded_levies_desc: "The sovereign calls for men beyond those who owe customary service. Local officers draw up parish rolls and name the households that must furnish recruits."

 law_noble_army: "Noble Army"
 law_noble_army_desc: "Military service is founded upon the obligations of the landed nobility. Great lords furnish retainers and mounted men, while noble officers command the forces they have raised in the sovereign's name."

 law_early_standing_army: "Early Standing Army"
 law_early_standing_army_desc: "Permanent regiments are retained in the ruler's pay even in peacetime. Regular drill, established officers, and permanent garrisons gradually replace the temporary forces raised only for a campaign."

 law_elite_training: "Elite Training"
 law_elite_training_desc: "Selected companies drill throughout the year under veteran officers. Their ranks are taught to march, manoeuvre, and handle their arms together."

 law_devsirme_system: "Devşirme System"
 law_devsirme_system_desc: "Under the devşirme, boys from Christian communities in the Ottoman domains are taken into the Sultan's service, converted to Islam, and educated for the palace, administration, or Janissary corps."

 law_mercenary_army: "Condottieri"
 law_mercenary_army_desc: "Italian rulers and communes contract companies of professional soldiers through a condotta. These condottieri serve for pay under their own captains, supplying the military expertise sought by the competing states of the peninsula."

 # POLICING #

 law_no_security: "No Organized Watch"
 law_no_security_desc: "The maintenance of order is left to households, guilds, estates, and customary local authority. When a crime is committed, neighbors and kin are expected to raise the alarm and pursue the offender themselves."

 law_town_watch: "Town Watch"
 law_town_watch_desc: "Towns divide their streets into wards and require householders or hired watchmen to patrol them after dark. The watch guards gates, raises alarms, and keeps the peace within the urban community."

 law_state_constabulary: "State Constabulary"
 law_state_constabulary_desc: "A permanent body of constables serves the state under regular officers and regulations. Stationed across the country, it represents the civil authority beyond the walls of the capital and the largest towns."

 law_armed_police_corps: "Armed Police Corps"
 law_armed_police_corps_desc: "Public order is entrusted to a disciplined, armed force organized on military lines. Its detachments may be deployed against brigandage, disorder, and resistance to the authority of the state."

 # BUREAUCRATIC OFFICES #

 law_decentralized_offices: "Decentralized Offices"
 law_decentralized_offices_desc: "The business of government is entrusted to provincial estates, town councils, local courts, and hereditary officeholders. The Crown rules through a patchwork of established privileges and regional customs rather than a uniform administration."

 law_centralized_offices: "Centralized Offices"
 law_centralized_offices_desc: "The offices of the realm are gathered into a single hierarchy under the central government. Appointed officials, written regulations, and regular reporting extend the authority of the capital into every province."

 law_namestnik_office: "Namestnik Administration"
 law_namestnik_office_desc: "A namestnik is the sovereign's deputy in a province or frontier land. Entrusted with judicial, fiscal, and military authority, he governs locally in the ruler's name while representing the interests of the center."

 law_rentekammeret: "Rentekammeret"
 law_rentekammeret_desc: "The Rentekammeret is the Danish Crown's chamber of revenue. It maintains the accounts of the realm and administers the Crown lands, customs duties, and other sources of royal income."

 law_defterhanei_amire: "Defterhane-i Amire"
 law_defterhanei_amire_desc: "The Defterhane-i Amire, the Imperial Registry, preserves the Ottoman state's defters: registers of land surveys, revenues, timar obligations, and public accounts. Its records bind the provinces to the administrative order of the Porte."

 # MAJOR GOVERNMENT REFORM

 law_no_reform: "No Government Reform"
 law_no_reform_desc: "Petitions, judgments, and acts of government proceed under the forms handed down by earlier generations."

# ARMY DOCTRINE #

 law_no_army_doctrine: "No Formal Doctrine"
 law_no_army_doctrine_desc: "Captains muster their companies and array them for battle according to the custom of their service and the needs of the day."

 law_offensive_stance: "Offensive Doctrine"
 law_offensive_stance_desc: "Commanders seek to bring the enemy to battle on their own terms, pressing the march before the opposing host can gather."

 law_defensive_stance: "Defensive Doctrine"
 law_defensive_stance_desc: "Commanders choose the ground on which they will stand, anchoring their lines on fieldworks, rivers, and fortified towns."

 law_artillery_warfare: "Grand Batteries"
 law_artillery_warfare_desc: "Gunners survey the approaches and lay their pieces in batteries. Where once sappers alone set to work, a breach may now be opened by the gun."

 law_infantry_warfare: "Pike and Shot Tradition"
 law_infantry_warfare_desc: "Battalions form around the foot soldier. The long pike keeps horsemen at bay while ranks of shot fire and retire to reload."

 law_cavalry_warfare: "Mounted Warfare"
 law_cavalry_warfare_desc: "Mounted troops screen the march and harry the enemy's flanks. Squadrons gather for the charge when the opposing line begins to waver."

# FEUDAL DE JURE LAW #

 law_by_tradition: "By Tradition"
 law_by_tradition_desc: "The rights of lord and vassal rest on old usage, the testimony of local courts, and the obligations sworn by their forebears."

 law_by_blood: "By Blood"
 law_by_blood_desc: "Claims to fiefs and jurisdictions descend by blood. A pedigree may carry as much weight before a court as any charter."

# Administrative System #

 law_autonomous_councils: "Autonomous Councils"
 law_autonomous_councils_desc: "Provincial estates and town councils govern under their own charters, sending delegates to the capital when a matter concerns the whole realm."

 law_central_council: "Central Council"
 law_central_council_desc: "The chief officers of the realm sit together at the capital, where petitions are heard and instructions sent to provincial governors."

 law_local_courts: "Local Courts"
 law_local_courts_desc: "Provincial magistrates and customary courts hear the disputes of their districts according to local usage."

 law_confederal_union: "Confederal Union"
 law_confederal_union_desc: "The members of the union retain their own laws and estates. Their envoys meet to bargain over contributions and common undertakings."

 law_federal_state: "Federal State"
 law_federal_state_desc: "A common charter divides the powers of government between a federal authority and its constituent states, each with its own courts and assemblies."

 law_absolute_leadership: "Absolute Leadership"
 law_absolute_leadership_desc: "Orders go out in the ruler's name. Provincial officers answer to the sovereign, who may revoke the privileges on which their predecessors relied."

 law_feudal_administration: "Feudal Administration"
 law_feudal_administration_desc: "The Crown governs through fiefs and oaths. Each lord holds court on his lands and renders the service owed for them."

 law_unitary_administration: "Unitary Administration"
 law_unitary_administration_desc: "Officials in every province carry out the same ordinances and answer to the ministries of the capital."

# Noble Privileges #

 law_strengthen_the_nobility: "Strengthen Noble Privileges"
 law_strengthen_the_nobility_desc: "Patents and charters confirm the nobility's exemptions, jurisdiction, and customary precedence in the service of the realm."

 law_curtail_the_nobility: "Curtail Noble Privileges"
 law_curtail_the_nobility_desc: "The Crown calls in old charters for review. Noble households must defend their courts and exemptions before the sovereign's officers."

 # Cultural Traditions #

 law_martial_society: "Martial Society"
 law_martial_society_desc: "Service in the host is held to be a mark of honour. Families preserve the memory of campaigns in their songs, heraldry, and rites of passage."

 law_civil_society: "Civil Society"
 law_civil_society_desc: "Public distinction is sought in the council chamber, the learned professions, and service to the town."

 # Levy Law #

 law_inclusive_levy: "Inclusive Levies"
 law_inclusive_levy_desc: "Muster rolls draw on the towns, estates, and communities of the realm. Each is called upon to furnish men according to its obligations."

 law_noble_levy: "Noble Levies"
 law_noble_levy_desc: "The sovereign issues the summons to the lords, who assemble their retainers and lead them beneath their own banners."

 law_peasant_levy: "Peasant Levies"
 law_peasant_levy_desc: "The summons passes from village to village. Each parish names the households that must send men to the muster."

# Economic Policy #

 law_no_economic_policy: "No Economic Policy"
 law_no_economic_policy_desc: "Markets, workshops, and farms are governed by the ordinances and bargains of the places in which they are found."

 law_lockean_proviso: "Lockean Proviso"
 law_lockean_proviso_desc: "Those who work the land may claim it as their own, provided that they leave enough and as good for others."

 law_war_economy: "War Economy"
 law_war_economy_desc: "The first claims on foundries, workshops, and stores belong to the army. Officials issue contracts and requisitions to supply the host."

 law_economic_theory: "Economic Theory"
 law_economic_theory_desc: "Treasury officers and men of letters debate the coinage, public credit, and the proper use of the sovereign's revenue."

 law_agriculture_economy: "Agrarian Economy"
 law_agriculture_economy_desc: "The court regards the land as the source of the realm's wealth. Its ordinances concern fields, herds, and the business of the market town."

 law_fishing_economy: "Maritime Economy"
 law_fishing_economy_desc: "Coastal towns live by their fisheries and the sea. Charters govern the landing, curing, and sale of the catch."

 law_pirate_economy: "Privateering Economy"
 law_pirate_economy_desc: "Captains sail under letters of marque and bring captured vessels to port, where judges hear claims to the cargo and divide the prizes."

# Foreign Cultural Law #

 law_allow_foreign_rituals: "Allow Foreign Rituals"
 law_allow_foreign_rituals_desc: "Communities may keep their own feast days, rites, and places of worship under the protection of the magistrate."

 law_integrate_foreign_traditions: "Integrate Foreign Traditions"
 law_integrate_foreign_traditions_desc: "Customs brought from abroad are taken up in local festivals, households, and guilds until they have a place in the public life of the realm."

# Rights of the Clergy

 law_strengthen_the_clergy: "Strengthen Rights of the Clergy"
 law_strengthen_the_clergy_desc: "Religious houses hold property and administer their own affairs under charters confirmed by the state."

 law_curtail_the_clergy: "Curtail the Clergy"
 law_curtail_the_clergy_desc: "Clerical courts and estates are brought under civil jurisdiction. Ecclesiastical privileges are subject to review by the magistrate."

# Rights of the Burghers

 law_strengthen_the_burghers: "Strengthen Rights of the Burghers"
 law_strengthen_the_burghers_desc: "Chartered towns choose their officers, regulate their markets, and send deputies to speak on behalf of their burgesses."

 law_curtail_the_burghers: "Curtail the Burghers"
 law_curtail_the_burghers_desc: "The sovereign reserves the right to appoint town officers and review the privileges claimed under municipal and guild charters."

# Mining Laws
 law_no_mining_ownership: "Unregulated Extraction"
 law_no_mining_ownership_desc: "Prospectors sink shafts by local custom and settle disputes over seams and workings before the nearest magistrate."

 law_noble_controlled_mining: "Noble-Controlled Mining"
 law_noble_controlled_mining_desc: "The holder of a seigneury may work the veins beneath his land or grant a lease in return for rent and a share of the ore."

 law_burghers_controlled_mining: "Burgher-Controlled Mining"
 law_burghers_controlled_mining_desc: "Companies of burghers pool their capital, purchase mining leases, and employ masters to oversee the workings."

 law_commoner_controlled_mining: "Commoner Mining Rights"
 law_commoner_controlled_mining_desc: "Miners may stake a claim and work it in their own right. Local mining courts hear disputes over boundaries and shares."

 law_royal_fifth_mining: "Royal Fifth"
 law_royal_fifth_mining_desc: "Gold and silver are brought before the royal assayer, who weighs the metal and sets aside the fifth owed to the Crown."

# Economic System

 law_manorial_economy: "Manorial Economy"
 law_manorial_economy_desc: "Land and labor are bound by a web of customary dues and obligations. Lords draw wealth from their estates, while local production meets much of the countryside's needs."

 law_chartered_economy: "Chartered Economy"
 law_chartered_economy_desc: "The Crown grants charters to privileged enterprises, entrusting private investors with ventures that serve the realm's commercial and fiscal ambitions."

 law_agrarian_economy: "Agrarian Economy"
 law_agrarian_economy_desc: "Landowners and farmers hold the foremost place in economic life. Their fields and herds provide the foundation of the nation's wealth."

 law_colonial_economy: "Colonial Economy"
 law_colonial_economy_desc: "Plantations, farms, and mines supply the needs of an overlord, while restrictions on manufacturing keep the colony dependent on goods from abroad."

 law_economic_liberalism: "Economic Liberalism"
 law_economic_liberalism_desc: "Private enterprise and open competition guide investment and production. The state's direct ownership gives way to the judgment of merchants and investors."

 law_merchant_economy: "Merchant Economy"
 law_merchant_economy_desc: "Commerce rests in the hands of merchants, shopkeepers, and independent producers. Private ventures and the rewards of trade shape the fortunes of the realm."

 law_state_directed_economy: "State-Directed Economy"
 law_state_directed_economy_desc: "Officials direct investment and oversee enterprises in pursuit of the state's priorities. Private interests remain, but the government holds the commanding role."

 law_interventionism: "Crown Oversight"
 law_laissez_faire: "Market Economy"
 law_cooperative_ownership: "Communal Economy"
 law_command_economy: "Crown-Controlled Economy"

 law_enclosed_estates: "Enclosed Estates"
 law_enclosed_estates_desc: "Surveyors parcel out the common fields and mark their new boundaries. Hedges and fences follow where villagers once held rights of pasture."
 law_magna_carta: "Magna Carta"
 law_magna_carta_desc: "The king confirms the liberties of the realm in a charter, binding the Crown to customary justice and to the counsel of its leading subjects."

 law_noble_command: "Noble Command"
 law_noble_command_desc: "Command belongs to families whose rank and service entitle them to lead the host."

 law_meritocratic_leadership: "Meritocratic Leadership"
 law_meritocratic_leadership_desc: "Officers earn commissions through service in the field and the judgment of their superiors."

 law_ruler_general: "Sovereign in Command"
 law_ruler_general_desc: "The sovereign takes the field in person, receiving reports from the captains and issuing orders beneath the royal standard."

 law_steppe_horde: "Steppe Horde"
 law_steppe_horde_desc: "A khan rules through a confederation of clans whose chiefs bring mounted retinues to his standard. Assemblies of leading lineages acclaim the ruler and deliberate on war and succession."

 law_no_navy_doctrine: "No Naval Doctrine"
 law_no_navy_doctrine_desc: "Captains put to sea in the sovereign's service with orders for the voyage at hand, relying on the customs of their ports and the judgment of their crews."

 law_figurehead_position: "Figurehead Crown"
 law_figurehead_position_desc: "The sovereign presides over ceremonies and gives assent in name. Ministers and assemblies conduct the government of the realm."

 law_absolute_rule: "Absolute Rule"
 law_absolute_rule_desc: "The sovereign issues ordinances by prerogative and calls councils at pleasure. The estates may petition the throne, whose judgment is final."

 law_court_of_the_star_chamber: "Court of Star Chamber"
 law_court_of_the_star_chamber_desc: "The king's councillors hear cases of riot, intimidation, and abuse of office, even when the accused can command the loyalty of the local courts."
