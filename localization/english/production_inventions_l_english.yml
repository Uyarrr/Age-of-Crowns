l_english:

 ### ERA 1 ###

 agriculture:0 "Agriculture"
 agriculture_desc:0 "Families reckon the year by sowing and harvest, setting aside seed grain before the winter stores are divided."

 quarrying:0 "Quarrying"
 quarrying_desc:0 "Quarrymen follow the seams of good stone, splitting blocks with wedges before teams haul them to the mason's yard."

 metallurgy:0 "Metallurgy"
 metallurgy_desc:0 "Smiths judge a metal by the color it takes in the fire and the way it yields beneath the hammer."

 mining_laws:0 "Mining Laws"
 mining_laws_desc:0 "Mining ordinances settle who may open a vein, how claims are marked, and what share of the ore belongs to the lord."

 bronze_working:0 "Bronze Working"
 bronze_working_desc:0 "A founder pours molten bronze into prepared molds for fittings, vessels, and edged implements."

 iron_working:0 "Iron Working"
 iron_working_desc:0 "At the forge, repeated blows drive slag from the bloom until the smith has iron fit to draw into bars."

 windmill:0 "Windmills"
 windmill_desc:0 "The miller turns his sails into the wind and takes a share of the flour ground between his stones."

 serfs:0 "Serfdom"
 serfs_desc:0 "Binding peasants to the land ensures a stable and controlled agricultural workforce. While limiting personal freedom, serfdom increases consistent food production and rural stability."

 fine_metals_mining:0 "Precious Metal Mining"
 fine_metals_mining_desc:0 "The extraction of gold, silver, and sulfur provides valuable resources for trade, currency, and advanced production. These materials become vital for both economic and military development."

 woodcutting:0 "Woodcutting"
 woodcutting_desc:0 "Woodmen fell marked trees in winter, when the timber can be dragged out before the tracks turn to mire."

 glassworks:0 "Glassworks"
 glassworks_desc:0 "Glassmakers keep their furnaces alight day and night, drawing soft glass into bottles, panes, and drinking vessels."

 furniture_workshop:0 "Furniture Workshops"
 furniture_workshop_desc:0 "Joiners lay up seasoned boards for chests, settles, and tables made to order in town shops."

 cloth_workshop:0 "Cloth Workshops"
 cloth_workshop_desc:0 "Spinners bring yarn to the weaver, and woven cloth passes to fullers, shearers, and dyers before it reaches the stall."

 papermill:0 "Paper Mills"
 papermill_desc:0 "Water drives the hammers that beat old linen into pulp, which the papermaker lifts on a wire screen."

 fishing:0 "Fishing Industry"
 fishing_desc:0 "Boats put out with the tide and return to quays where fish are sold fresh, salted, or dried."

 sheep_ranching:0 "Sheep Ranching"
 sheep_ranching_desc:0 "The breeding of sheep provides wool for textile production. Ranching integrates agriculture and industry, supporting growing demand for fabrics."

 tannery:0 "Tanneries"
 tannery_desc:0 "Hides steep in pits of ground bark for months before curriers dress the leather for sale."

 pottery_desc:0 "The potter turns local clay into crocks and jugs, then fires a kiln's worth of wares at a time."

 brewery:0 "Brewing"
 brewery_desc:0 "Malt is steeped and boiled in the brewhouse, where hops lend bitterness to the beer sent out in casks."

 ### ERA 2 ###

 workshop_standardization:0 "Workshop Standardization"
 workshop_standardization_desc:0 "Masters agree on gauges and measures so that pieces worked at separate benches can be fitted together."

 fiber_paper:0 "Fiber Paper Production"
 fiber_paper_desc:0 "Papermakers sort linen and hemp rags by grade before beating them into stock for writing and printing sheets."

 expanded_quarrying:0 "Expanded Quarrying"
 expanded_quarrying_desc:0 "Quarry leases spread along productive seams, and cranes lift blocks from faces that once stood beyond reach."

 encourage_agricultural_industry:0 "Encourage Agricultural Industry"
 encourage_agricultural_industry_desc:0 "The Crown offers premiums for reclaimed land and improved husbandry, inviting landholders to submit accounts of their trials."

 encourage_resource_industry:0 "Encourage Resource Industry"
 encourage_resource_industry_desc:0 "Surveyors report promising deposits and timber stands, and the Crown grants leases to those willing to work them."

 ### ERA 3 ###

 new_world_crops:0 "New World Crops"
 new_world_crops_desc:0 "Maize, beans, and other crops from the Americas find places in gardens and fields far from the communities that first cultivated them."

 sugar_plantation:0 "Sugar Plantations"
 sugar_plantation_desc:0 "In the cane districts, enslaved laborers cut and crush the harvest while the boiling houses tend their kettles through the night."

 cotton_plantation:0 "Cotton Plantations"
 cotton_plantation_desc:0 "Merchants contract for bales of cotton from plantations where the crop is picked and cleaned before shipment."

 tobacco_plantation:0 "Tobacco Plantations"
 tobacco_plantation_desc:0 "Tobacco leaves hang in curing sheds before they are packed into hogsheads for the Atlantic trade."

 faceting:0 "Gem Faceting"
 faceting_desc:0 "Lapidaries cut and polish flat faces on a stone, taking care to preserve its color and bring out its brilliance."

 refined_saiger_process:0 "Refined Saiger Process"
 refined_saiger_process_desc:0 "Advanced metallurgical techniques improve the separation and refinement of metals such as silver from lead. This increases efficiency and profitability in mining operations."

 standardized_planks_and_bricks:0 "Standardized Materials"
 standardized_planks_and_bricks_desc:0 "Yards sell timber by agreed sizes and bricks from common molds, allowing builders to order materials by the measure."

 patio_process:0 "Patio Process"
 patio_process_desc:0 "A chemical process for extracting silver using mercury revolutionizes precious metal production. It greatly increases output and supports expanding global trade."

 expanded_iron_mining:0 "Expanded Iron Mining"
 expanded_iron_mining_desc:0 "Furnace masters contract for ore from outlying pits as well as from the old workings near their hearths."

 expanded_logging:0 "Expanded Logging"
 expanded_logging_desc:0 "Timber crews cut farther upriver and float their logs to the sawyards with the spring waters."

 potatoes:0 "Potato Cultivation"
 potatoes_desc:0 "The potato finds a place in field ridges and kitchen gardens, its tubers stored in pits through the winter."

 apprenticeship_system:0 "Apprenticeship System"
 apprenticeship_system_desc:0 "An indenture binds the apprentice to a master for a term of years in return for instruction, board, and a place at the bench."
 bakery: "Bakeries"
 bakery_desc: "The baker tends the town oven before dawn, ready for the day's loaves and the dough brought by neighboring households."
 slaughterhouse: "Slaughterhouses"
 slaughterhouse_desc: "Butchers bring livestock to appointed yards, where carcasses are dressed and the hides set aside for tanners."
 apiary: "Apiaries"
 apiary_desc: "Beekeepers set straw skeps by orchards and gardens, gathering honey for the table and wax for candles."
 distillery: "Distilleries"
 distillery_desc: "The stillman draws strong spirits from fermented mash, judging the run by its scent and strength."
 iron_mining: "Iron Mining"
 iron_mining_desc: "Miners follow bands of ironstone and sort the richest ore for the furnaces."
 coal_mining: "Coal Mining"
 coal_mining_desc: "Colliers break coal from shallow seams and send it to town hearths and smithies."
 copper_mining: "Copper Mining"
 copper_mining_desc: "Green stains in exposed rock guide prospectors to copper veins worth following underground."
 tin_mining: "Tin Mining"
 tin_mining_desc: "Tin workers wash stream gravels and crush vein ore to gather the heavy grains bound for the smelter."
 silver_mining: "Silver Mining"
 silver_mining_desc: "Silver ores draw merchants and mine owners into upland districts where a single rich seam can sustain a town."
 gold_mining: "Gold Mining"
 gold_mining_desc: "Gold seekers wash river sands and break quartz, weighing their finds on small balances."
 gem_mining: "Gem Mining"
 gem_mining_desc: "Workers sort gravel and broken stone by hand, looking for the color and clarity that lapidaries prize."
 workshops: "Workshops"
 workshops_desc: "Under one roof a master keeps benches, tools, and materials for apprentices and journeymen to share."
 luxury_cloth_workshop: "Luxury Cloth Workshops"
 luxury_cloth_workshop_desc: "Fine silks and figured fabrics take shape on looms tended by weavers trained to follow elaborate patterns."
 luxury_furniture_workshop: "Luxury Furniture Workshops"
 luxury_furniture_workshop_desc: "Patrons choose fine veneers, carved ornaments, and costly fittings for pieces commissioned from cabinetmakers."
 perfumery: "Perfumery"
 perfumery_desc: "Perfumers blend fragrant oils and resins into scented waters, pomades, and powders for the dressing table."
 guild_bakers: "Bakers’ Guilds"
 guild_bakers_desc: "Guild wardens inspect ovens and weigh loaves against the assize of bread."
 bakery_wood_heating: "Wood-Fired Bakehouses"
 bakery_wood_heating_desc: "Oven tenders burn bundles of dry wood, then rake out the embers before loading the hot hearth with loaves."
 bronze_tools: "Bronze Tools"
 bronze_tools_desc: "Founders cast awls, chisels, and other implements in bronze, finishing their edges on a stone."
 expanded_copper_mining: "Expanded Copper Mining"
 expanded_copper_mining_desc: "Mine owners open new adits along the copper lodes and build dressing floors near the workings."
 pack_animal_transport: "Pack-Animal Transport"
 pack_animal_transport_desc: "Strings of mules carry panniers over passes where a laden cart could scarcely turn."
 heavy_plow: "Heavy Plow"
 heavy_plow_desc: "An iron coulter slices the sod ahead of a moldboard that turns the heavy earth into a furrow."
 manured_fields: "Manured Fields"
 manured_fields_desc: "Farmers cart dung from byre and stable to the fields before plowing it into the soil."
 expanded_beekeeping: "Expanded Beekeeping"
 expanded_beekeeping_desc: "Rows of hives line sheltered garden walls, their swarms tended through the flowering months."
 mulberry_cultivation: "Mulberry Cultivation"
 mulberry_cultivation_desc: "Growers prune mulberry trees for the tender leaves fed to silkworms in the rearing house."
 guild_distillery: "Distillers’ Guilds"
 guild_distillery_desc: "Licensed stillmen defend their trade from unregistered sellers, and guild wardens inspect the wares offered in town."
 guild_brewery: "Brewers’ Guilds"
 guild_brewery_desc: "Brewers keep a common assize and dispute who may sell ale within the town walls."
 broadcloth_weaving: "Broadcloth Weaving"
 broadcloth_weaving_desc: "Broad lengths of woolen cloth go to the fulling mill, then stretch on tenterhooks to dry evenly."
 velvet_weaving: "Velvet Weaving"
 velvet_weaving_desc: "Velvet weavers form a raised pile over fine rods and cut the loops to give the face its soft nap."
 guild_butchery: "Butchers’ Guilds"
 guild_butchery_desc: "The butchers' guild assigns stalls and inspects the meat brought to market."
 guild_tannery: "Tanners’ Guilds"
 guild_tannery_desc: "Tanners protect access to bark, water, and hides through guild ordinances and long apprenticeships."
 intarsia: "Intarsia"
 intarsia_desc: "The inlayer fits pieces of wood of different colors into panels that depict arches, courtyards, and geometric designs."
 grafting_techniques: "Grafting Techniques"
 grafting_techniques_desc: "An orchard keeper binds a favored scion to hardy stock so that the new branch bears the fruit he knows."
 refined_tea_cultivation: "Refined Tea Cultivation"
 refined_tea_cultivation_desc: "Growers select tender shoots and judge each picking by the season and the character of the leaf."
 glassblowing: "Glassblowing"
 glassblowing_desc: "A glassblower gathers molten glass on a hollow iron and breathes it into a vessel while turning the pipe."
 organized_quarrying: "Organized Quarrying"
 organized_quarrying_desc: "Overseers mark out faces for extraction and lay tracks from the cut stone to the loading yard."
 pasture_management: "Pasture Management"
 pasture_management_desc: "Herds move between grazing grounds as the grass recovers, leaving the hay meadows ungrazed until the cut."
 improved_dye_cultivation: "Improved Dye Cultivation"
 improved_dye_cultivation_desc: "Dye growers select their madder roots and woad leaves with the dyer's vat in mind."
 bronze_casting: "Bronze Casting"
 bronze_casting_desc: "Founders prepare cores and molds for hollow bronze pieces, watching the pour for flaws that will show when the mold is broken."
 iron_casting: "Iron Casting"
 iron_casting_desc: "Foundrymen pour liquid iron into sand molds for vessels, weights, and fittings."
 turning_lathes: "Turning Lathes"
 turning_lathes_desc: "A turned spindle or chair leg takes its shape as the worker holds a steady edge against the revolving wood."
 resource_extraction: "Resource Extraction"
 resource_extraction_desc: "Surveyors mark timber stands, stone beds, and mineral outcrops before leases are granted to work them."
 cocoa_plantation: "Cocoa Plantation"
 cocoa_plantation_desc: "Cacao pods are split after harvest and the beans fermented and dried for shipment to chocolate makers."
 chili_plantation: "Chili Plantation"
 chili_plantation_desc: "The peppers of the Americas travel dried or ground, finding their way into market gardens and kitchens across the seas."
 chocolates: "Chocolate Making"
 chocolates_desc: "Chocolate makers roast and grind cacao, mixing the bitter paste with sugar for a drink served in fashionable houses."
 expanded_coal_mining: "Expanded Coal Mining"
 expanded_coal_mining_desc: "New pits join the older workings, and coal factors arrange regular cartage to riverside staithes."
 expanded_silver_mining: "Expanded Silver Mining"
 expanded_silver_mining_desc: "Capital from merchants pays for fresh galleries and ore mills in established silver districts."
 expanded_gold_mining: "Expanded Gold Mining"
 expanded_gold_mining_desc: "Mining companies take up adjoining claims and set stamp mills beside streams to crush gold-bearing rock."
 expanded_lead_mining: "Expanded Lead Mining"
 expanded_lead_mining_desc: "Lead miners reopen old veins and carry their ore to smelting mills for pipes, roofing, and shot."
 expanded_tin_mining: "Expanded Tin Mining"
 expanded_tin_mining_desc: "Tin districts extend their underground workings beyond the deposits first found in stream beds."
 free_trade: "Free Trade"
 free_trade_desc: "Merchants call on the Crown to strike down exclusive charters and let traders bargain on their own account."
 iron_tools: "Iron Tools"
 iron_tools_desc: "Farmers and artisans commission iron blades and edges that the local smith can draw out and repair."
 stoneworks: "Stoneworks"
 stoneworks_desc: "Stone yards dress blocks to measure before the wagons carry them to the building site."
 commercial_bakeries: "Commercial Bakeries"
 commercial_bakeries_desc: "Bakers buy flour by the sack and sell their loaves over the counter or to kitchens under contract."
 commercial_tanneries: "Commercial Tanneries"
 commercial_tanneries_desc: "Tannery owners buy hides in lots and lay out rows of pits along the waterways below town."
 expanded_fiber_farming: "Expanded Fiber Farming"
 expanded_fiber_farming_desc: "Larger fields of flax and hemp supply the retting ponds and the spinning rooms of the cloth districts."
 aromatic_spice_trade: "Aromatic Spice Trade"
 aromatic_spice_trade_desc: "Apothecaries and grocers buy cloves, cinnamon, and nutmeg from merchants who know the ports and seasons of the spice trade."
 organized_orchards: "Organized Orchards"
 organized_orchards_desc: "Rows of named varieties make it possible to gather fruit for the table, the cider press, and the winter store."
 large_scale_ranching: "Large Scale Ranching"
 large_scale_ranching_desc: "Herdsmen move cattle across extensive ranges and drive them to distant fairs when the beasts are ready for sale."
 indigo_cultivation: "Indigo Cultivation"
 indigo_cultivation_desc: "Indigo leaves are steeped and beaten in vats until the blue pigment settles for drying into cakes."
 bronze_alloying: "Bronze Alloying"
 bronze_alloying_desc: "Founders vary the share of tin in the charge to suit a bell, a bearing, or a piece of ordnance."
 putting_out_system: "Putting-Out System"
 putting_out_system_desc: "Merchant clothiers issue raw materials to households and collect the yarn or cloth when the work is done."
 brocade_weaving: "Brocade Weaving"
 brocade_weaving_desc: "Brocade weavers add decorative threads to the ground weave, raising figures that catch the light on rich cloth."
 exotic_wood_veneering: "Exotic Wood Veneering"
 exotic_wood_veneering_desc: "Cabinetmakers cut imported woods into thin leaves and match the grain across doors and drawer fronts."
 skilled_craftmanship: "Skilled Craftsmanship"
 skilled_craftmanship_desc: "Journeymen carry patterns and methods from town to town before presenting a masterwork of their own."
 bakery_coal_heating: "Coal-Fired Bakehouses"
 bakery_coal_heating_desc: "Coal reaches the bakehouse in sacks, and oven builders take pains to keep its smoke from the bread."
 homesteading: "Homesteading"
 homesteading_desc: "Settlers mark out holdings and raise houses before breaking the ground they intend to farm."
 deep_shaft_mining: "Deep-Shaft Mining"
 deep_shaft_mining_desc: "Mining ventures sink new shafts with timbered galleries and winding gear to reach seams below the old workings."
 deep_shaft_lead_mining: "Deep-Shaft Lead Mining"
 deep_shaft_lead_mining_desc: "Lead miners sink shafts beneath the hillside adits to follow veins below the drainage level."
 deep_shaft_tin_mining: "Deep-Shaft Tin Mining"
 deep_shaft_tin_mining_desc: "Tin lodes that descend below the old stream workings are followed by shaft and gallery."
 deep_shaft_copper_mining: "Deep-Shaft Copper Mining"
 deep_shaft_copper_mining_desc: "Copper ventures install winding gear over shafts sunk along the deeper reaches of the lode."
 deep_shaft_iron_mining: "Deep-Shaft Iron Mining"
 deep_shaft_iron_mining_desc: "Ironstone is raised in tubs from underground beds where an open cut would have required stripping too much earth."
 deep_shaft_coal_mining: "Deep-Shaft Coal Mining"
 deep_shaft_coal_mining_desc: "Colliers sink paired shafts to reach coal seams beneath earlier pits and carry air through the workings."
 deep_shaft_gem_mining: "Deep-Shaft Gem Mining"
 deep_shaft_gem_mining_desc: "Miners follow gem-bearing rock underground and sort the recovered stone above the shaft."
 deep_shaft_silver_mining: "Deep-Shaft Silver Mining"
 deep_shaft_silver_mining_desc: "Deep silver workings require owners to maintain pumps and hoists long before any ore is sold."
 deep_shaft_gold_mining: "Deep-Shaft Gold Mining"
 deep_shaft_gold_mining_desc: "Gold miners sink through hard rock to trace veins beneath the alluvial diggings."
 horse_harnessing: "Horse Harnessing"
 horse_harnessing_desc: "A padded collar lets a draught horse lean into its load without bearing the strain across its throat."
 distilled_aromatics: "Distilled Aromatics"
 distilled_aromatics_desc: "Perfumers draw the scent of blossoms and herbs into stills and collect it in glass receivers."
 rag_pulping: "Rag Pulping"
 rag_pulping_desc: "A roll fitted with blades tears linen rags into pulp in a circulating trough."
 stained_glassmaking: "Stained Glassmaking"
 stained_glassmaking_desc: "Glaziers cut colored glass to a cartoon and bind the pieces with lead to fill chapel and hall windows."
 managed_forestry: "Managed Forestry"
 managed_forestry_desc: "Woodwards mark compartments for cutting and reserve sound trees to seed the next growth."
 blast_furnaces: "Blast Furnaces"
 blast_furnaces_desc: "A continuous blast keeps the furnace hot enough for molten iron to run into the casting bed."
 refined_distillation: "Refined Distillation"
 refined_distillation_desc: "Distillers make repeated runs and keep the middle cut apart for spirits of more even character."
 cabinetmaking: "Cabinetmaking"
 cabinetmaking_desc: "Cabinetmakers fit fine drawers, doors, and locks into pieces built for countinghouses and drawing rooms."
 manufactories: "Manufactories"
 manufactories_desc: "A proprietor gathers workers under one roof and divides the making of a good among separate benches."
 bureaucractic_promotions: "Bureaucratic Promotions"
 bureaucractic_promotions_desc: "Clerks keep records of service and look to the next appointment for advancement within the offices of state."
 steel_mills: "Steel Mills"
 steel_mills_desc: "Furnaces and rolling equipment gather in steelworks that supply bars and plates to distant workshops."
 steel_tools: "Steel Tools"
 steel_tools_desc: "Toolmakers harden and temper steel edges for bench tools, blades, and dies."
 mechanized_baking: "Mechanized Baking"
 mechanized_baking_desc: "Driven mixers knead batches of dough for bakeries that supply crowded towns."
 leather_manufactories: "Leather Manufactories"
 leather_manufactories_desc: "Large leather works divide the sorting, soaking, tanning, and dressing of hides among dedicated rooms."
 meat_manufactories: "Meat Manufactories"
 meat_manufactories_desc: "Meat works divide slaughtering, cutting, and salting among crews that supply markets and provisioners."
 brewing_manufactories: "Brewing Manufactories"
 brewing_manufactories_desc: "Large breweries bring malt stores, vats, and cooperages together behind a single yard gate."
 distilling_manufactories: "Distilling Manufactories"
 distilling_manufactories_desc: "Distillery works take in grain by the cartload and send out casks bearing the proprietor's mark."
 pottery_manufactories: "Pottery Manufactories"
 pottery_manufactories_desc: "Potworks assign throwing, glazing, and decorating to separate hands before firing whole batches in large kilns."
 leaded_crystal_glass: "Leaded Crystal Glass"
 leaded_crystal_glass_desc: "Glassmakers add lead oxide to the batch, producing a clear glass prized by cutters for its brilliance."
 bronze_manufactories: "Bronze Manufactories"
 bronze_manufactories_desc: "Bronze works share patterns and molds across shops that specialize in casting, chasing, and finishing."
 mechanized_extraction: "Mechanized Extraction"
 mechanized_extraction_desc: "Mine owners commission engines and gearing to work pumps and hoists once driven by men or horses."
 mechanized_iron_mining: "Mechanized Iron Mining"
 mechanized_iron_mining_desc: "Powered winding gear carries tubs of ironstone from the shaft bottom to the sorting floor."
 mechanized_lead_mining: "Mechanized Lead Mining"
 mechanized_lead_mining_desc: "Lead mines put powered pumps below the old drainage adits and drive ore crushers at the surface."
 mechanized_copper_mining: "Mechanized Copper Mining"
 mechanized_copper_mining_desc: "Engine houses rise beside copper shafts, their pumps working through the shifts below."
 mechanized_tin_mining: "Mechanized Tin Mining"
 mechanized_tin_mining_desc: "Powered stamps break tin ore before it passes to the dressing floors for washing."
 mechanized_wood_logging: "Mechanized Logging"
 mechanized_wood_logging_desc: "Hauling machinery and powered saws take over much of the work between the felling ground and the timber yard."
 mechanized_quarrying: "Mechanized Quarrying"
 mechanized_quarrying_desc: "Winches and lifting gear carry dressed blocks from quarry benches to waiting wagons."
 mechanized_coal_mining: "Mechanized Coal Mining"
 mechanized_coal_mining_desc: "Engines drain and wind the collieries as coal is brought up in tubs from deeper seams."
 mechanized_gem_mining: "Mechanized Gem Mining"
 mechanized_gem_mining_desc: "Powered screens and washing gear sift gem-bearing gravel before the sorters examine the concentrate."
 mechanized_silver_mining: "Mechanized Silver Mining"
 mechanized_silver_mining_desc: "Powered mills crush silver ore at central works where miners send it by the wagonload."
 mechanized_gold_mining: "Mechanized Gold Mining"
 mechanized_gold_mining_desc: "Rows of powered stamps pound gold-bearing quartz before the crushed material goes to the dressing floor."
 court_perfumery: "Court Perfumery"
 court_perfumery_desc: "Court perfumers prepare scents for gloves, powder, and linen according to the fashion of the season."
 paper_standardization: "Paper Standardization"
 paper_standardization_desc: "Printers and stationers agree upon named sheet sizes and grades when they order from the mills."
 estate_agriculture: "Estate Agriculture"
 estate_agriculture_desc: "Landowners survey their estates and set down rotations, leases, and drainage works in plans for their stewards."
 scientific_stockbreeding: "Scientific Stockbreeding"
 scientific_stockbreeding_desc: "Breeders keep pedigrees and compare the offspring of selected animals before choosing their next stock."
 intensive_fruit_cultivation: "Intensive Fruit Cultivation"
 intensive_fruit_cultivation_desc: "Fruit growers train trees against warm walls and force early crops under glass for town markets."
 dye_estates: "Dye Estates"
 dye_estates_desc: "Estates grow and process dye plants on the same grounds, selling prepared color to merchant dyers."
 flying_shuttle: "Flying Shuttle"
 flying_shuttle_desc: "A cord sends the shuttle between the ends of the loom, where boxes catch it after each pass."
 silk_manufactories: "Silk Manufactories"
 silk_manufactories_desc: "Silk works assemble throwsters, dyers, and weavers in premises fitted for the handling of delicate yarn."
 furniture_manufactories: "Furniture Manufactories"
 furniture_manufactories_desc: "Furniture makers divide orders into patterns and component parts, with separate hands cutting, turning, and assembling them."
 boulle_marquetry: "Boulle Marquetry"
 boulle_marquetry_desc: "Sheets of brass and tortoiseshell are cut together so that each can be inlaid into the openings of the other."
 limited_companies: "Limited Companies"
 limited_companies_desc: "Investors subscribe for shares under terms that limit what creditors may claim from their private fortunes."
