l_english:
 aoc_church.1.t: "Dei Gratia Rex"
 aoc_church.1.d: "The Pope has promulgated a bull affirming that a Christian sovereign holds the crown under divine providence. Its words will be read in the courts and churches of Catholic Europe, where the bond between altar and throne remains a matter of public authority."
 aoc_church.1.f: "A papal bull takes its name from the lead seal, or bulla, fixed to the document. Copies carried the decree beyond Rome under the authority of the Apostolic See."
 aoc_church.1.a: "The decree is received."
 aoc_church.2.t: "Illius Qui Se Pro Divini"
 aoc_church.2.d: "A new bull calls upon Catholic rulers to defend the Church and those who fight in its name. From Rome, the decree passes through bishops and envoys to courts across Christendom, seeking common purpose amid the quarrels of princes."
 aoc_church.2.f: "Papal letters could summon rulers across political borders, though their force depended upon the willingness of each court to heed them."
 aoc_church.2.a: "Let the bull be proclaimed."
 aoc_church.3.t: "Misericordia Apostolica"
 aoc_church.3.d: "The Apostolic See has granted our treasury relief from the Church's tithe fund. Rome's envoys present the grant as an act of mercy toward a Catholic realm burdened by debt, to be delivered in installments while the need endures."
 aoc_church.3.f: "The papal treasury drew upon contributions from across the Catholic world. Its disbursements could carry both practical assistance and a reminder of Rome's place among Christian courts."
 aoc_church.3.a: "Receive the grant."
