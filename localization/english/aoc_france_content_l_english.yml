l_english:
 law_french_monarchy: "French Monarchy"
 law_french_monarchy_desc: "The Crown passes by hereditary right. The king governs through his council and dispenses justice in the name of the realm."
 gov_aoc_french_monarchy: "Kingdom"
 gov_aoc_french_monarchy_desc: "$gov_kingdom_desc$"
 law_ancient_french_taxation: "Ancient French Taxation"
 law_ancient_french_taxation_desc: "The countryside bears the taille, and the Crown takes a share of estate profits. The seigneurs retain the standing of their order."
 law_french_noble_armies: "French Noble Armies"
 law_french_noble_armies_desc: "Commission and command belong to men of noble birth, whose households furnish the mounted lances of the king's host."
 law_edict_of_nantes: "Edict of Nantes"
 law_edict_of_nantes_desc: "Catholic worship retains the Crown's protection, while the Reformed may worship in appointed places and seek redress in the king's courts."

 building_hospices_de_beaune: "Hospices de Beaune"
 building_hospices_de_beaune_desc: "Beneath the tiled roofs of the Hôtel-Dieu, the sisters tend the sick in a ward overlooked by its chapel."
 pmg_hospices_de_beaune: "Hospital Endowment"
 pm_hospices_de_beaune: "Ward of the Poor"
 building_chateau_de_vincennes: "Château de Vincennes"
 building_chateau_de_vincennes_desc: "The keep of Vincennes guards a royal residence, chapel, and treasury behind its walls."
 pmg_chateau_de_vincennes: "Royal Household"
 pm_chateau_de_vincennes: "Residence and Garrison"

 combat_unit_type_france_renaissance_gendarmes: "Renaissance Gendarmes"
 combat_unit_type_france_renaissance_gendarmes_desc: "Royal men-at-arms ride in plate harness with couched lances, backed by the mounted attendants of their company."
 ship_ship_type_carrack_supply_capacity_mult: "$ship_type_carrack$ $ship_supply_capacity_add$"
 ship_ship_type_carrack_supply_capacity_mult_desc: "$ship_supply_capacity_add_desc$"

 FIC: "Compagnie des Indes"
 FIC_ADJ: "French East Indian"
 company_aoc_france_east_india: "Compagnie des Indes"
 company_aoc_france_east_india_desc: "A chartered company of French merchants sends its agents to the ports of India to secure cloth, dyes, and passage for its ships."
 je_aoc_france_east_india_status: "Establish the Compagnie des Indes and hold land in three distinct Indian state regions, with at least 250,000 inhabitants and £500,000 GDP."
 aoc_france_east_india_outcome: "The Company's Indian possessions secure 25 years of trade support."
 france_east_india.1.t: "The French Factories"
 france_east_india.1.d: "[SCOPE.sCountry('aoc_french_indian_company').GetName] has established a network of trading posts in India. Its cargoes now sustain a regular trade with France."
 france_east_india.1.f: "At the warehouse door, brokers call out the price of dyed cloth while the Company's clerk scratches another figure into his ledger."
 france_east_india.1.a: "See that the next ships sail well laden."
