l_english:
 law_french_monarchy: "French Monarchy"
 law_french_monarchy_desc: "The Crown passes by hereditary right. The king governs through his council and dispenses justice in the name of the realm."
 gov_aoc_french_monarchy: "Kingdom"
 gov_aoc_french_monarchy_desc: "$gov_kingdom_desc$"
 law_ancient_french_taxation: "Ancient French Taxation"
 law_ancient_french_taxation_desc: "The countryside bears the taille, and the Crown takes a share of estate profits. The seigneurs retain the standing of their order."
 law_france_noblesse_d_epee: "Noblesse d'Épée"
 law_france_noblesse_d_epee_desc: "Commission and command belong to men of noble birth, whose households furnish the mounted lances of the king's host."
 law_edict_of_nantes: "Edict of Nantes"
 law_edict_of_nantes_desc: "Catholic worship retains the Crown's protection, while the Reformed may worship in appointed places and seek redress in the king's courts."

 building_hospices_de_beaune: "Hospices de Beaune"
 building_hospices_de_beaune_desc: "Beneath the tiled roofs of the Hôtel-Dieu, the sisters tend the sick in a ward overlooked by its chapel."
 pmg_hospices_de_beaune: "Hospital Endowment"
 pm_hospices_de_beaune: "Ward of the Poor"
 building_chateau_de_vincennes: "Château de Vincennes"
 building_chateau_de_vincennes_desc: "The keep of Vincennes guards a royal residence, chapel, and treasury behind its walls."
 pmg_chateau_de_vincennes: "Royal Household"
 pm_chateau_de_vincennes: "Household and Chancery"

 combat_unit_type_france_renaissance_gendarmes: "Renaissance Gendarmes"
 combat_unit_type_france_renaissance_gendarmes_desc: "Royal men-at-arms ride in plate harness with couched lances, backed by the mounted attendants of their company."
 ship_ship_type_carrack_supply_capacity_mult: "$ship_type_carrack$ $ship_supply_capacity_add$"
 ship_ship_type_carrack_supply_capacity_mult_desc: "$ship_supply_capacity_add_desc$"

 FIC: "Compagnie des Indes"
 FIC_ADJ: "French East Indian"
 company_aoc_france_east_india: "Compagnie des Indes"
 company_aoc_france_east_india_desc: "A chartered company of French merchants sends its agents to the ports of India to secure cloth, dyes, and passage for its ships."
 je_aoc_france_east_india_status: "Establish the Compagnie des Indes and hold land in three distinct Indian state regions, with at least 250,000 inhabitants and £500,000 GDP."
 aoc_france_east_india_outcome: "The Company's Indian possessions secure 25 years of trade support."
 france_east_india.1.t: "The French Factories"
 france_east_india.1.d: "[SCOPE.sCountry('aoc_french_indian_company').GetName] has established a network of trading posts in India. Its cargoes now sustain a regular trade with France."
 france_east_india.1.f: "At the warehouse door, brokers call out the price of dyed cloth while the Company's clerk scratches another figure into his ledger."
 france_east_india.1.a: "See that the next ships sail well laden."

 building_chateau_de_chambord: "Château de Chambord"
 building_chateau_de_chambord_desc: "A double stair winds through the keep, opening onto terraces above the king's hunting grounds."
 pmg_chateau_de_chambord: "Royal Estate"
 pm_chateau_de_chambord: "Hunting Lodge and Household"

 building_royal_atlantic_naval_yard: "Royal Atlantic Naval Yard"
 building_royal_atlantic_naval_yard_desc: "Shipwrights lay keels on the royal slips while seasoned oak, cordage, and sailcloth fill the storehouses."
 pmg_royal_atlantic_naval_yard: "Royal Dockyard"
 pm_royal_atlantic_naval_yard: "Royal Shipwrights"

 building_academie_francaise: "Académie française"
 building_academie_francaise_desc: "The academicians gather in Paris to judge disputed words and prepare a dictionary for printers and men of letters."
 pmg_academie_francaise: "Academy Charter"
 pm_academie_francaise: "The Dictionary Commission"

 building_palace_of_versailles: "Palace of Versailles"
 building_palace_of_versailles_desc: "Ministers wait upon the king while the old families watch for the smallest sign of royal favor."
 pmg_palace_of_versailles: "Royal Court"
 pm_palace_of_versailles: "The Court at Versailles"

 building_louvre_museum: "Louvre Museum"
 building_louvre_museum_desc: "Catalogues are printed and the doors of the Grande Galerie open. Crowds gather beneath paintings once reserved for royal eyes."
 pmg_louvre_museum: "Public Museum"
 pm_louvre_museum: "The National Collections"

 aoc_presidial_courts.title: "Presidial Courts"
 aoc_presidial_courts.desc: "A royal edict has established presidial courts in the provinces. Their magistrates can now settle lesser appeals locally, easing the burden on the parlements."
 aoc_presidial_courts.flavor: "The clerk broke the royal seal and read the edict aloud. At the back of the hall, a petitioner folded away the letter he had meant to carry to Paris."
 aoc_presidial_courts.a: "Give the courts clerks to keep the Crown’s records."
 aoc_presidial_courts.b: "Have the magistrates hear disputes over the royal levy."
 aoc_presidial_courts_bureaucracy: "Presidial Court Registers"
 aoc_presidial_courts_tax_capacity: "Royal Levy Hearings"

 aoc_france_ottoman_alliance.title: "Franco-Ottoman Alliance"
 aoc_france_ottoman_alliance.desc: "The French council has drawn up a proposal for the Ottoman court. An understanding with the sultan would oblige the Habsburgs to reckon with a rival on either flank."
 aoc_france_ottoman_alliance.flavor: "The envoy folded the letter of credence inside his coat. The instructions for his private audience were to travel in a different dispatch."
 aoc_france_ottoman_alliance.a: "Send the envoy to the Porte."
 aoc_france_ottoman_alliance.b: "Leave the letter unsigned."
 aoc_france_ottoman_reply.title: "An Envoy at the Porte"
 aoc_france_ottoman_reply.desc: "An envoy from [SCOPE.sCountry('aoc_france_envoys').GetName] has presented a letter proposing an alliance. The divan must decide how to answer a court that shares its quarrel with the Habsburgs."
 aoc_france_ottoman_reply.flavor: "The interpreter read the letter aloud, pausing over the titles. When he had finished, the grand vizier asked whether the envoy carried instructions that had been left unwritten."
 aoc_france_ottoman_reply.a: "Have the grand vizier seal our answer."
 aoc_france_ottoman_reply.b: "Dismiss the envoy with our compliments."
 aoc_france_ottoman_alliance_treaty: "Franco-Ottoman Alliance"
 aoc_france_calais.title: "The Capture of Calais"
 aoc_france_calais.desc: "Calais remains in the hands of [SCOPE.sCountry('aoc_france_calais_holder').GetName]. The garrison watches the approaches from the sea, but French officers report that the landward defenses are thinly manned."
 aoc_france_calais.flavor: "On the table lay a pilot’s chart of the creeks and causeways. The captain placed his finger on a road the garrison believed impassable in winter."
 aoc_france_calais.a: "Order the army to take Calais."
 aoc_france_calais.b: "Let the garrison keep its watch."
 aoc_france_calais_war: "War for Calais"
 aoc_france_calais_campaign: "The Calais Campaign"
 aoc_france_calais_abandoned: "Calais Left Unclaimed"
 aoc_france_francs_archers.title: "Francs-Archers Established"
 aoc_france_francs_archers.desc: "The Crown has sent draft ordinances to the baillis. The proposal calls on each parish to furnish an archer and exempts the men selected from the taille."
 aoc_france_francs_archers.flavor: "After Mass the parishioners gathered in the churchyard. The bailli’s clerk opened his roll and asked who owned a bow in good repair."
 aoc_france_francs_archers.a: "Issue the ordinance to the parishes."
 aoc_france_francs_archers.b: "Put our faith in the standing companies."
 aoc_france_parish_archers: "Parish Archers"
 aoc_france_muster_drills: "Drill of the Standing Companies"
 aoc_france_cloth_of_gold.title: "The Field of the Cloth of Gold"
 aoc_france_cloth_of_gold.desc: "Royal heralds have proposed a meeting near Ardres with [SCOPE.sCountry('aoc_france_cloth_of_gold_guest').GetName]. Each court would come with its household, its champions, and its own account of what a meeting between equals should look like."
 aoc_france_cloth_of_gold.flavor: "The master of the tents held a bolt of cloth against the light. The gold thread was sound, he told the steward, but the poles would have to be taller."
 aoc_france_cloth_of_gold.a: "Send the heralds across the Channel."
 aoc_france_cloth_of_gold.b: "Hold the festivities at our own court."
 aoc_france_cloth_of_gold_reply.title: "An Invitation to Ardres"
 aoc_france_cloth_of_gold_reply.desc: "[SCOPE.sCountry('aoc_france_envoys').GetName] has invited our court to a meeting near Ardres. The heralds propose that the two sovereigns enter the field at the same hour, with neither arriving to receive the other."
 aoc_france_cloth_of_gold_reply.flavor: "The chamberlain drew two lines on the map and measured them with a length of silk. There would be quarrels enough over precedence without starting one on the road."
 aoc_france_cloth_of_gold_reply.a: "Our household will ride to the meeting."
 aoc_france_cloth_of_gold_reply.b: "The messenger may return without us."
 aoc_france_court_splendor: "Splendor of the French Court"
 aoc_france_antarctique.title: "France Antarctique"
 aoc_france_antarctique.desc: "A company of mariners seeks royal patronage for an expedition to Guanabara Bay. The harbor has long drawn French traders, and their pilots have marked an island where a fort might stand."
 aoc_france_antarctique.flavor: "At the quay a shipwright asked whether to load a second forge. The captain said the first would be ashore before the crew had time to miss France."
 aoc_france_antarctique.a: "Give the expedition our patronage."
 aoc_france_antarctique.b: "Leave the venture to the merchants."
 aoc_france_antarctique_patronage: "Patronage of France Antarctique"
 aoc_france_antarctique_involvement_tt: "France gains 100 Involvement in Brazil each month while the expedition is funded."
 aoc_france_assassination.title: "Assassination of the Sovereign"
 aoc_france_assassination.desc: "An assailant has struck the sovereign in Paris. With the royal household in confusion, the council has been summoned to settle who will govern in the Crown’s name."
 aoc_france_assassination.flavor: "The councillors came by a side door. In the antechamber a servant still held the morning’s petitions, though no one had told him where to take them."
 aoc_france_assassination.a: "Summon the council."
 aoc_france_assassination_regency: "Regency of the French Crown"
 aoc_france_glass_charter.title: "The Saint-Gobain Glass Charter"
 aoc_france_glass_charter.desc: "The council has received a petition for letters patent to make mirror glass in France. The petitioners have offered to bring foreign craftsmen into their employ, while the merchants of Paris urge the Crown to keep the trade open."
 aoc_france_glass_charter.flavor: "Two mirrors lay on the council table. The smaller had been made in France, and the larger had come from Venice packed in straw."
 aoc_france_glass_charter.a: "Grant letters patent to the manufactory."
 aoc_france_glass_charter.b: "Leave the trade open to all merchants."
 aoc_france_royal_glassworks: "Royal Mirror Manufactory"
 aoc_france_glass_merchants: "Open Glass Trade"

 aoc_france_argentier_a: "The King’s Argentier — Seize the accounts"
 aoc_france_argentier_b: "The King’s Argentier — Keep his credit"
 aoc_france_argentier.title: "The King’s Argentier"
 aoc_france_argentier.desc: "Accusations against Jacques Cœur have reached the royal council. The king’s argentier has creditors and agents throughout the Mediterranean, and the councillors must decide whether to open an inquiry into his affairs."
 aoc_france_argentier.flavor: "A clerk from Bourges set two ledgers on the table. The smaller one held the sums the king still owed him."
 aoc_france_argentier.a: "Seize the accounts."
 aoc_france_argentier.b: "Keep his credit."
 aoc_france_customs_a: "The Customs of the Realm — Put the customs in writing"
 aoc_france_customs_b: "The Customs of the Realm — Leave the matter to the bailiwicks"
 aoc_france_customs.title: "The Customs of the Realm"
 aoc_france_customs.desc: "The king’s jurists have proposed that each bailiwick put its customary law into writing. Local officers, nobles, and practitioners are to agree on the wording before it goes before the royal council."
 aoc_france_customs.flavor: "The oldest witness could recite the custom readily enough. When the clerk read it back, two seigneurs asked him to begin again."
 aoc_france_customs.a: "Put the customs in writing."
 aoc_france_customs.b: "Leave the matter to the bailiwicks."
 aoc_france_sorbonne_a: "A Press at the Sorbonne — Keep the press at the college"
 aoc_france_sorbonne_b: "A Press at the Sorbonne — Let the printers sell freely"
 aoc_france_sorbonne.title: "A Press at the Sorbonne"
 aoc_france_sorbonne.desc: "Scholars at the Sorbonne have brought three printers to Paris. Their first sheets are passing from hand to hand, and the college must decide how long it will house the workshop."
 aoc_france_sorbonne.flavor: "A student turned the page over to see where the scribe had signed. The printer handed him another sheet, with the very same crooked letter."
 aoc_france_sorbonne.a: "Keep the press at the college."
 aoc_france_sorbonne.b: "Let the printers sell freely."
 aoc_france_lyon_fairs_a: "The Fairs of Lyon — Renew the fair privileges"
 aoc_france_lyon_fairs_b: "The Fairs of Lyon — Collect the ordinary dues"
 aoc_france_lyon_fairs.title: "The Fairs of Lyon"
 aoc_france_lyon_fairs.desc: "The aldermen of Lyon have petitioned the Crown to renew their four fairs. They ask that visiting merchants travel under royal safeguard and trade under the privileges granted to the city."
 aoc_france_lyon_fairs.flavor: "A factor from Lucca had already taken rooms by the Saône. He told his landlord he would pay for the whole fortnight once he saw the seal."
 aoc_france_lyon_fairs.a: "Renew the fair privileges."
 aoc_france_lyon_fairs.b: "Collect the ordinary dues."
 aoc_france_blois_books_a: "The King’s Books at Blois — Open the shelves to scholars"
 aoc_france_blois_books_b: "The King’s Books at Blois — Reserve the collection for the court"
 aoc_france_blois_books.title: "The King’s Books at Blois"
 aoc_france_blois_books.desc: "Books from the royal collections have been brought together at Blois, including manuscripts carried back from Italy. The keeper has asked how the collection should be ordered and who may consult it."
 aoc_france_blois_books.flavor: "The keeper found a scrap of Italian verse tucked inside a book of hours. He gave it a line of its own in the inventory."
 aoc_france_blois_books.a: "Open the shelves to scholars."
 aoc_france_blois_books.b: "Reserve the collection for the court."
 aoc_france_royal_readers_a: "The Royal Readers — Endow the readers"
 aoc_france_royal_readers_b: "The Royal Readers — Let the colleges appoint their own"
 aoc_france_royal_readers.title: "The Royal Readers"
 aoc_france_royal_readers.desc: "The Crown has received a proposal to appoint salaried readers in Greek, Hebrew, and mathematics. Their lectures would be open to students in Paris."
 aoc_france_royal_readers.flavor: "The reader wrote a line of Greek on the board. A young man at the back stood on the bench to copy the letters."
 aoc_france_royal_readers.a: "Endow the readers."
 aoc_france_royal_readers.b: "Let the colleges appoint their own."
 aoc_france_lyon_silk_a: "The Silk Looms of Lyon — Charter the silk workshops"
 aoc_france_lyon_silk_b: "The Silk Looms of Lyon — Leave the venture to the merchants"
 aoc_france_lyon_silk.title: "The Silk Looms of Lyon"
 aoc_france_lyon_silk.desc: "Two merchants have asked the Crown to grant privileges to silk weavers who settle in Lyon. The city’s consuls have offered to find rooms for the first workshops."
 aoc_france_lyon_silk.flavor: "The merchant brought a length of silk to the consuls. The master weaver turned it over and showed them where the work had gone wrong."
 aoc_france_lyon_silk.a: "Charter the silk workshops."
 aoc_france_lyon_silk.b: "Leave the venture to the merchants."
 aoc_france_villers_cotterets_a: "The Ordinance of Villers-Cotterêts — Royal Ordinance"
 aoc_france_villers_cotterets_b: "The Ordinance of Villers-Cotterêts — Allow provincial forms"
 aoc_france_villers_cotterets.title: "The Ordinance of Villers-Cotterêts"
 aoc_france_villers_cotterets.desc: "A draft ordinance from Villers-Cotterêts has reached the royal council. Among its articles on the administration of justice is a provision requiring court records and judgments to be drawn up in French."
 aoc_france_villers_cotterets.flavor: "The clerk could write the judgment in Latin from memory. For the French copy he asked the bailiff to read the disputed sentence aloud."
 aoc_france_villers_cotterets.a: "Issue the ordinance throughout the realm."
 aoc_france_villers_cotterets.b: "Allow provincial forms."
 aoc_france_lescot_louvre_a: "A New Wing for the Louvre — Commission Lescot"
 aoc_france_lescot_louvre_b: "A New Wing for the Louvre — Repair the old fortress"
 aoc_france_lescot_louvre.title: "A New Wing for the Louvre"
 aoc_france_lescot_louvre.desc: "Pierre Lescot has presented plans for a new wing of the Louvre. The court must decide whether to pull down part of the old fortress to make room for it."
 aoc_france_lescot_louvre.flavor: "The master mason sounded the old wall with his hammer. By noon the men had chalked a door onto a stretch of stone built to keep men out."
 aoc_france_lescot_louvre.a: "Commission Lescot."
 aoc_france_lescot_louvre.b: "Repair the old fortress."
 aoc_france_poissy_a: "The Colloquy of Poissy — Hear both confessions"
 aoc_france_poissy_b: "The Colloquy of Poissy — End the colloquy"
 aoc_france_poissy.title: "The Colloquy of Poissy"
 aoc_france_poissy.desc: "The court has invited Catholic prelates and Reformed ministers to meet at Poissy. The chancellor hopes an agreement on worship can be reached before the quarrel spreads further through the provinces."
 aoc_france_poissy.flavor: "The usher had chairs enough for every churchman. He spent the morning being told who could sit in them."
 aoc_france_poissy.a: "Hear both confessions."
 aoc_france_poissy.b: "End the colloquy."
 aoc_france_gregorian_calendar_a: "Ten Days in December — Publish rules for the missing days"
 aoc_france_gregorian_calendar_b: "Ten Days in December — Let the magistrates settle disputes"
 aoc_france_gregorian_calendar.title: "Ten Days in December"
 aoc_france_gregorian_calendar.desc: "The chancellery has prepared an order adopting the Gregorian calendar. Ten dates will be omitted in December, and magistrates are asking how to reckon leases, fairs, and debts that fall in the interval."
 aoc_france_gregorian_calendar.flavor: "The landlord brought his rent book to the notary and pointed to the fifteenth. The notary asked him to show it on the new almanac."
 aoc_france_gregorian_calendar.a: "Publish rules for the missing days."
 aoc_france_gregorian_calendar.b: "Let the magistrates settle disputes."
 aoc_france_paulette_a: "The Paulette — Accept the annual payment"
 aoc_france_paulette_b: "The Paulette — Keep appointments at the Crown’s discretion"
 aoc_france_paulette.title: "The Paulette"
 aoc_france_paulette.desc: "The treasury has proposed an annual payment for holders of royal offices. Those who pay would have greater security in passing their offices to their heirs, a concession the king’s financiers are prepared to make."
 aoc_france_paulette.flavor: "A councillor sent for his son and showed him where he kept the letters patent. Then he sent for the man who had valued the office."
 aoc_france_paulette.a: "Accept the annual payment."
 aoc_france_paulette.b: "Keep appointments at the Crown’s discretion."
 aoc_france_riquet_canal_a: "A Canal Between Two Seas — Fund Riquet’s canal"
 aoc_france_riquet_canal_b: "A Canal Between Two Seas — Improve the river landings"
 aoc_france_riquet_canal.title: "A Canal Between Two Seas"
 aoc_france_riquet_canal.desc: "Pierre-Paul Riquet has presented a plan to carry boats from the Garonne to the Mediterranean. The council has asked him to show how water from the Montagne Noire would feed the canal at its highest point."
 aoc_france_riquet_canal.flavor: "An envoy from Toulouse traced the route as far as the summit and lifted his finger. Riquet moved it uphill again, to where the water would come from."
 aoc_france_riquet_canal.a: "Fund Riquet’s canal."
 aoc_france_riquet_canal.b: "Improve the river landings."
 aoc_france_science_academy_a: "The Academy of Sciences — Put the Academy on the royal payroll"
 aoc_france_science_academy_b: "The Academy of Sciences — Commission particular inquiries"
 aoc_france_science_academy.title: "The Academy of Sciences"
 aoc_france_science_academy.desc: "Mathematicians, astronomers, and natural philosophers have begun meeting at the king’s library. Their patrons have proposed keeping them in regular session to investigate questions put to them by the court."
 aoc_france_science_academy.flavor: "While the anatomist waited for his specimen, an astronomer borrowed the lamp. By the time it came back, the naturalists had started without him."
 aoc_france_science_academy.a: "Put the Academy on the royal payroll."
 aoc_france_science_academy.b: "Commission particular inquiries."
 aoc_france_cassini_map_a: "Cassini’s Map of France — Survey the whole country"
 aoc_france_cassini_map_b: "Cassini’s Map of France — Survey the frontiers first"
 aoc_france_cassini_map.title: "Cassini’s Map of France"
 aoc_france_cassini_map.desc: "Surveyors under Cassini have begun assembling a general map of France. They propose to join the provincial surveys in a single series of engraved sheets, all drawn to the same scale."
 aoc_france_cassini_map.flavor: "From the church tower the surveyor took his bearing. Below, two villagers argued over which hamlet he had come to put on the map."
 aoc_france_cassini_map.a: "Survey the whole country."
 aoc_france_cassini_map.b: "Survey the frontiers first."
 aoc_france_chappe_telegraph_a: "The Telegraph to Lille — Extend the public network"
 aoc_france_chappe_telegraph_b: "The Telegraph to Lille — Keep the Lille line for official dispatches"
 aoc_france_chappe_telegraph.title: "The Telegraph to Lille"
 aoc_france_chappe_telegraph.desc: "A dispatch sent from Paris has reached Lille by way of Claude Chappe’s telegraph. The government has called for a report on extending the line to other cities."
 aoc_france_chappe_telegraph.flavor: "At Lille the clerk copied the dispatch and asked when the courier had left Paris. The station keeper pointed up at the arms of the tower."
 aoc_france_chappe_telegraph.a: "Extend the public network."
 aoc_france_chappe_telegraph.b: "Keep the Lille line for official dispatches."
 aoc_france_metric_measures_a: "One Measure for France — Require the new measures"
 aoc_france_metric_measures_b: "One Measure for France — Permit both measures"
 aoc_france_metric_measures.title: "One Measure for France"
 aoc_france_metric_measures.desc: "Commissioners have proposed a common system of weights and measures for the country. Market inspectors are asking when they can expect official standards against which to test the measures used in their towns."
 aoc_france_metric_measures.flavor: "A draper laid the new rule beside his old ell. He fetched his account book and began with the order that was due on Monday."
 aoc_france_metric_measures.a: "Require the new measures."
 aoc_france_metric_measures.b: "Permit both measures."
 aoc_france_civil_code_a: "The Civil Code — Promulgate a single code"
 aoc_france_civil_code_b: "The Civil Code — Preserve provincial exceptions"
 aoc_france_civil_code.title: "The Civil Code"
 aoc_france_civil_code.desc: "The jurists have delivered a single draft code to govern civil affairs throughout France. Its provisions on marriage, inheritance, property, and contracts are ready for final consideration."
 aoc_france_civil_code.flavor: "A notary received the printed draft with his morning post. Before breaking the seal, he took down the customary law his father had used and set it beside the parcel."
 aoc_france_civil_code.a: "Promulgate a single code."
 aoc_france_civil_code.b: "Preserve provincial exceptions."

 aoc_france_office_revenue: "The Annual Payment"
 combat_unit_type_france_elite_gendarmes: "Elite Gendarmes"
 combat_unit_type_france_elite_gendarmes_desc: "Veteran gendarmes of the French Crown ride in picked companies, taking their place at the head of the charge."
