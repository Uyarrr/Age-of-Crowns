l_english:
 peasant_levy:0 "Peasant Levy"
 peasant_levy_desc:0 "When the summons comes, village households furnish men for the host with whatever arms they can bring."

 archer:0 "Archer"
 archer_desc:0 "The disciplined use of bows introduces a flexible and deadly form of ranged warfare. Training archers requires skill and coordination, but their ability to project force at distance reshapes battlefield tactics and defensive planning."

 defensive_army:0 "Defensive Army"
 defensive_army_desc:0 "Captains choose ground behind ditches, hedges, and river crossings, where the line can hold and an enemy must come to them."

 ranching:0 "Ranching"
 ranching_desc:0 "Horse breeders keep their best mares on open pasture and bring young stock to fairs where merchants and captains seek mounts."

 horsemen:0 "Horsemen"
 horsemen_desc:0 "Combining horsemanship with martial training produces fast, shock-capable troops. Mounted warriors dominate open terrain, extend strategic reach, and provide decisive advantages in reconnaissance, pursuit, and flanking maneuvers."

 standing_army:0 "Standing Army"
 standing_army_desc:0 "Maintaining permanent troops under direct state authority marks a major transformation in warfare. A standing army offers greater discipline, readiness, and central control than temporary levies, allowing rulers to project power more consistently both at home and abroad."

 shipbuilding:0 "Shipbuilding"
 shipbuilding_desc:0 "Master shipwrights choose crooked timbers for the frames and fit the planking to the lines of the hull."

 navigation:0 "Navigation"
 navigation_desc:0 "Pilots keep notes on soundings, landmarks, tides, and the bearings of familiar harbors."

 naval_traditions:0 "Naval Traditions"
 naval_traditions_desc:0 "A sailor learns the watch, the handling of sail, and the captain's signals from hands who have served before him."

 cog:0 "Cog"
 cog_desc:0 "Broad-bellied cogs carry cargo between northern ports, and in wartime their raised castles shelter men with bows."

 traditional_galley:0 "Traditional Galley"
 traditional_galley_desc:0 "Oars carry long, low galleys through a calm while their crews make ready to close and board."

 weapon_crafting:0 "Weapon Crafting"
 weapon_crafting_desc:0 "Armories place orders with bowyers, fletchers, and smiths whose marks distinguish their workmanship."

 mandatory_training:0 "Mandatory Training"
 mandatory_training_desc:0 "Local ordinances require men of fighting age to appear at appointed musters and practice with their arms."

 professional_army:0 "Professional Army"
 professional_army_desc:0 "Captains keep companies on the rolls and expect wages to be paid in peace as well as on campaign."

 saltpeter_works:0 "Saltpeter Works"
 saltpeter_works_desc:0 "Saltpeter refiners sell their crystals to powder makers under contracts drawn up by the ordnance office."

 cannonry:0 "Cannonry"
 cannonry_desc:0 "Rulers retain master gunners to tend their pieces and judge where stone walls will yield to shot."

 houfnice:0 "Houfnice"
 houfnice_desc:0 "Field gunners carry compact pieces with the host, making ready to fire from defended positions in the line."

 men_at_arms:0 "Men-at-Arms"
 men_at_arms_desc:0 "Well-equipped and professionally maintained soldiers form the backbone of organized warfare in the late medieval and early modern world. Better armored and more disciplined than levied infantry, men-at-arms provide dependable strength in both offensive and defensive operations."

 military_drill:0 "Military Drill"
 military_drill_desc:0 "Regular drilling turns armed men into coordinated formations capable of acting as a single body. Repetition of commands, maneuver practice, and standardized discipline improve battlefield performance, readiness, and the long-term quality of military forces."

 cavalrymen:0 "Cavalrymen"
 cavalrymen_desc:0 "Heavier and more specialized mounted troops bring speed, prestige, and shock power to the battlefield. Properly trained cavalrymen excel in charges, pursuit, and battlefield exploitation, making them a decisive arm for states that can afford to field them."

 pike_and_shot:0 "Pike and Shot"
 pike_and_shot_desc:0 "Drill masters teach shot and pike to move together, with ranks opening to receive men who have discharged their pieces."

 coastal_expansion:0 "Coastal Expansion"
 coastal_expansion_desc:0 "Surveyors sound unfamiliar anchorages and mark the shores where ships may water or shelter."

 supply_lines:0 "Supply Lines"
 supply_lines_desc:0 "Provisioners maintain depots behind the marching host and send wagons forward by appointed roads."

 domineering_influence:0 "Domineering Influence"
 domineering_influence_desc:0 "Envoys use the weight of a powerful court to press smaller neighbors for concessions and assurances."

 message_relays:0 "Message Relays"
 message_relays_desc:0 "Fresh horses wait at appointed posts to carry sealed dispatches to the next station."

 electric_telegraph:0 "Electric Telegraph"
 electric_telegraph_desc:0 "The transmission of messages through electrical signals revolutionizes the speed of command and administration. Governments and generals can coordinate armies, respond to crises, and manage distant territories with an immediacy impossible in earlier ages."

 landing_craft:0 "Landing Craft"
 landing_craft_desc:0 "Specialized vessels designed to move troops and equipment directly onto hostile shores greatly improve amphibious operations. By reducing the hazards of disembarkation, landing craft allow naval powers to launch invasions with greater speed, coordination, and effectiveness."
 horseman: "Horseman"
 horseman_desc: "A rider accustomed to long days in the saddle can carry dispatches or watch the roads ahead of the host."
 armored_horseman: "Armored Horseman"
 armored_horseman_desc: "A man with the means to keep a warhorse rides to muster in mail and helmet, with a shield and lance."
 salt_collecting: "Salt Collecting"
 salt_collecting_desc: "Shallow pans hold brine until sun and wind leave a crust that workers rake into heaps."
 fur_hunting: "Fur Hunting"
 fur_hunting_desc: "Trappers follow winter trails and bring their pelts to trading posts before the spring thaw."
 ivory_hunting: "Ivory Hunting"
 ivory_hunting_desc: "Ivory dealers buy tusks through hunting parties and inland traders, and carvers prize the material for small, costly objects."
 footman: "Footman"
 footman_desc: "Recruits muster on foot with spears, shields, and padded coats furnished by household or town."
 trebutchet: "Trebuchet"
 trebutchet_desc: "Siege carpenters raise a timber frame from which a falling counterweight drives a long throwing arm."
 professional_training: "Professional Training"
 professional_training_desc: "Paid soldiers rehearse formations and changes of front under officers who drill the same companies throughout the year."
 crossbowman: "Crossbowman"
 crossbowman_desc: "Crossbow makers supply spanning gear and bolts alongside the bows issued to town militias and hired companies."
 shock_tactics: "Shock Tactics"
 shock_tactics_desc: "Captains drill their mounted men to keep close order until the moment of the charge."
 man_at_arms: "Man-at-Arms"
 man_at_arms_desc: "Service contracts specify the harness, weapons, and attendants expected of a man-at-arms."
 cavalryman: "Cavalryman"
 cavalryman_desc: "Mounted companies learn to scout at a distance, carry orders, and cover the road behind a marching army."
 armored_cavalryman: "Armored Cavalryman"
 armored_cavalryman_desc: "Improved plate harness covers the rider's limbs while allowing him the movement needed to fight in the saddle."
 mediterranean_galley: "Mediterranean Galley"
 mediterranean_galley_desc: "Mediterranean yards build sleek galleys with ranks of oars and fighting platforms at the bow."
 net_and_line_fishing: "Net-and-Line Fishing"
 net_and_line_fishing_desc: "Crews fit their boats with nets for the shoals and baited lines for fish that feed near the bottom."
 iron_weapons: "Iron Weapons"
 iron_weapons_desc: "Swordsmiths and armorers select sound iron and fit steel cutting edges to weapons that must bear hard use."
 extra_supplies: "Extra Supplies"
 extra_supplies_desc: "Quartermasters reckon spare shoes, cordage, and sacks of meal before a company takes the road."
 early_carrack: "Early Carrack"
 early_carrack_desc: "Shipwrights build high-sided sailing ships with capacious holds for ventures beyond familiar coasts."
 renaissance_shipbuilding: "Renaissance Shipbuilding"
 renaissance_shipbuilding_desc: "Master builders record proportions and lay out frames from full-sized lines drawn on the floor of the yard."
 barque: "Barque"
 barque_desc: "Small sailing vessels carry dispatches and goods into harbors where larger ships must remain offshore."
 hulk: "Hulk"
 hulk_desc: "Broad cargo vessels take grain and timber aboard for the passage between the great northern ports."
 distant_markets: "Distant Markets"
 distant_markets_desc: "Factors settle in foreign ports, writing home with prices, customs dues, and the dates of the next fairs."
 reinforced_hulls: "Reinforced Hulls"
 reinforced_hulls_desc: "Shipwrights use heavier framing and knees to bind the decks and sides of vessels built for hard service."
 bronze_fastened_dockyards: "Bronze Fastened Dockyards"
 bronze_fastened_dockyards_desc: "Dockyard smiths supply bronze fittings and fastenings for parts of the ship exposed to salt water."
 nitrary_works: "Nitrary Works"
 nitrary_works_desc: "Nitrary keepers tend beds of prepared earth from which refiners draw saltpeter for the powder mills."
 overseas_supply_networks: "Overseas Supply Networks"
 overseas_supply_networks_desc: "Victualing agents arrange stocks of biscuit, water, and naval stores at ports along the fleet's passage."
 halberdier: "Halberdier"
 halberdier_desc: "Armorers forge a polearm that combines an axe blade, a thrusting point, and a hook on one haft."
 falconet: "Falconet"
 falconet_desc: "Founders cast light pieces that crews can bring into the field or mount aboard a ship."
 light_lancer: "Light Lancer"
 light_lancer_desc: "Captains raise lightly equipped horsemen who carry lances on patrol and pursuit duty."
 lancer: "Lancer"
 lancer_desc: "Mounted companies practice bringing their lances to bear together without breaking the line of the advance."
 war_galley: "War Galley"
 war_galley_desc: "War galleys carry guns forward, where the master can point the whole vessel as the oars bring it into action."
 colonial_horse_breeding: "Colonial Horse Breeding"
 colonial_horse_breeding_desc: "Horses carried overseas are put to pasture and bred on ranches that supply settlements and frontier posts."
 pattern_welding: "Pattern Welding"
 pattern_welding_desc: "Smiths weld differently worked bars together, drawing them into blades that show a pattern when polished."
 oceanic_navigation: "Oceanic Navigation"
 oceanic_navigation_desc: "Pilots reckon latitude from the heavens and keep records of the prevailing winds on long passages."
 military_traditions: "Military Traditions"
 military_traditions_desc: "Regiments keep their colors, rolls, and customs of service as one generation of soldiers yields to the next."
 improved_spy_organization: "Improved Spy Organization"
 improved_spy_organization_desc: "Agents abroad send reports under cipher and meet couriers whose names they know only by arrangement."
 state_consolidation: "State Consolidation"
 state_consolidation_desc: "A ruler brings scattered garrisons and provincial forces under officers who answer directly to the capital."
 flute: "Fluyt"
 flute_desc: "The Dutch fluyt carries a broad hold beneath a narrow upper deck, with rigging a small crew can manage."
 caravel: "Caravel"
 caravel_desc: "Pilots favor handy caravels for working along unfamiliar coasts and exploring their shallows."
 carrack: "Carrack"
 carrack_desc: "High castles stand above the broad hulls of carracks built for long voyages with heavy cargo."
 greater_blockades: "Greater Blockades"
 greater_blockades_desc: "Squadrons take station off enemy harbors, watching the approaches and sending tenders inshore to report sail."
 advanced_tactics_training: "Advanced Tactics Training"
 advanced_tactics_training_desc: "Officers rehearse reliefs, changes of formation, and the passage of one body of troops through another."
 handgonner: "Handgonner"
 handgonner_desc: "Town arsenals issue small handguns that the bearer must steady while applying a glowing match."
 ordnance_casting: "Ordnance Casting"
 ordnance_casting_desc: "Ordnance founders pour great guns in prepared molds and test each casting before it leaves the yard."
 engineer_corps: "Engineer Corps"
 engineer_corps_desc: "Engineers trained in surveying and fortification draw the lines of siege approaches and lay out new defenses."
 pikemen: "Pikemen"
 pikemen_desc: "Companies drill with long pikes, learning to lower the points in concert while keeping the rear ranks close."
 pistoleer: "Pistoleer"
 pistoleer_desc: "Wheel-lock pistols become part of the mounted soldier's equipment, carried ready in holsters at the saddle."
 chambered_cannon: "Chambered Cannon"
 chambered_cannon_desc: "Gun founders make pieces with removable powder chambers that a crew may exchange at the breech."
 expanded_salt_collecting: "Expanded Salt Collecting"
 expanded_salt_collecting_desc: "Salt makers extend their pans and channels to gather brine across a wider stretch of coast."
 organized_nitrary_industry: "Organized Nitrary Industry"
 organized_nitrary_industry_desc: "The ordnance office lets contracts for regular deliveries from established beds and refining houses."
 deep_sea_fishing: "Deep Sea Fishing"
 deep_sea_fishing_desc: "Fishing vessels carry salt and barrels on longer voyages, preserving the catch before they return to port."
 luxurious_supplies: "Luxurious Supplies"
 luxurious_supplies_desc: "Officers' messes order wine, fine provisions, and tableware even when the regiment takes the field."
 selective_breeding: "Selective Breeding"
 selective_breeding_desc: "Horse breeders choose which mares to cover according to the temper, build, and endurance of their stock."
 naval_reformation: "Naval Reformation"
 naval_reformation_desc: "Naval boards regularize the fitting and payment of ships and draw up standing instructions for their officers."
 galleass: "Galleass"
 galleass_desc: "The galleass carries a heavier hull and more guns than the ordinary galley, with oars to move when sail fails."
 letters_of_marque: "Letters of Marque"
 letters_of_marque_desc: "A commission from the sovereign authorizes a private captain to take enemy prizes and answer for them in port."
 brig: "Brig"
 brig_desc: "Two square-rigged masts carry a brig on merchant passages and the patrols undertaken by smaller men-of-war."
 pinnace: "Pinnace"
 pinnace_desc: "A pinnace carries dispatches, surveys anchorages, and keeps company with larger ships on expedition."
 matchlock_mechanisms: "Matchlock Mechanisms"
 matchlock_mechanisms_desc: "A pivoted arm brings the burning match to the pan at a squeeze of the trigger."
 galleon: "Galleon"
 galleon_desc: "Shipwrights draw out the bow and lower the foreworks of ocean-going ships built to carry guns and cargo."
 reformed_army_training: "Reformed Army Training"
 reformed_army_training_desc: "Regiments work from common drill books, so recruits learn the same commands and motions throughout the army."
 arquebusier: "Arquebusier"
 arquebusier_desc: "The shoulder-stocked arquebus gives foot companies a match-fired weapon they can carry through a campaign."
 heavy_lancer: "Heavy Lancer"
 heavy_lancer_desc: "The best-mounted companies retain the heavy lance and breastplate even as more horsemen carry pistols."
 barrel_boring: "Barrel Boring"
 barrel_boring_desc: "Gunsmiths and founders use boring machinery to finish the inside of gun barrels to a regular diameter."
 military_revolution: "Military Revolution"
 military_revolution_desc: "Treasuries, magazines, and permanent officers take on the business of maintaining armies through successive campaigns."
 steel_weapons: "Steel Weapons"
 steel_weapons_desc: "Armorers temper steel blades for weapons issued from stores as well as for privately commissioned arms."
 state_armories: "State Armories"
 state_armories_desc: "The ordnance office keeps weapons under seal in central stores and sends inspectors to test deliveries."
 early_standing_army: "Early Standing Army"
 early_standing_army_desc: "The sovereign retains regiments in permanent establishments, with rolls and rates of pay fixed by warrant."
 chemical_nitrate_refining: "Chemical Nitrate Refining"
 chemical_nitrate_refining_desc: "Refining houses supply powder mills with saltpeter of a more uniform grade."
 commercial_fishing_fleets: "Commercial Fishing Fleets"
 commercial_fishing_fleets_desc: "Merchants outfit flotillas for seasonal fisheries and arrange cooperage and storage at their home ports."
 musketeer: "Musketeer"
 musketeer_desc: "Drill books set down the loading motions and the order in which ranks of musketeers are to fire."
 skirmisher: "Skirmisher"
 skirmisher_desc: "Light infantry learn to work in extended order, using folds in the ground and falling back by pairs."
 hussar: "Hussar"
 hussar_desc: "Regiments adopt the light horseman's equipment and customs associated with Hungarian cavalry."
 gallop_cavalry: "Gallop Cavalry"
 gallop_cavalry_desc: "Cavalry drill calls for squadrons to keep their dressing as they close at a gallop with swords drawn."
 royal_mortar: "Royal Mortar"
 royal_mortar_desc: "Ordnance establishments maintain heavy mortars and their beds for the siege trains of the Crown."
 state_stud_farms: "State Stud Farms"
 state_stud_farms_desc: "The state keeps breeding stallions at appointed studs and records the mares brought to them."
 state_warhorse_breeding: "State Warhorse Breeding"
 state_warhorse_breeding_desc: "Remount officers select breeding stock with the size and steadiness required for service in heavy squadrons."
 xebec: "Xebec"
 xebec_desc: "The xebec's long hull and lateen sails suit the light winds and shifting airs of Mediterranean waters."
 merchantman: "Merchantman"
 merchantman_desc: "Ocean merchants commission ships to carry a substantial cargo through long voyages between provisioning ports."
 frigate: "Frigate"
 frigate_desc: "A frigate carries its principal battery on a single gun deck and is sent ahead on scouting and cruising service."
 two_decker: "Two-Decker"
 two_decker_desc: "Two continuous gun decks carry the battery of a ship intended to stand in the line of battle."
 state_arsenals: "State Arsenals"
 state_arsenals_desc: "Arsenals bring together foundries, repair shops, and magazines under officers responsible for the standing stock."
 levee_en_masse: "Levée en Masse"
 levee_en_masse_desc: "The nation summons its citizens to service, charging households and workshops with their share of the war."
 rifleman: "Rifleman"
 rifleman_desc: "Rifled arms are issued to marksmen trained to aim individually in open order."
 fusilier: "Fusilier"
 fusilier_desc: "Regiments take up flintlock arms and teach recruits the volleys and bayonet drill of the line."
 interchangeable_parts: "Interchangeable Parts"
 interchangeable_parts_desc: "Arms makers work to patterns and gauges so a lock or fitting can be replaced from stock in the field."
 cuirassier: "Cuirassier"
 cuirassier_desc: "Heavy squadrons retain polished breastplates and straight swords as the distinguishing equipment of their service."
 flying_battery: "Flying Battery"
 flying_battery_desc: "Horse artillery mounts its crews as well as its guns, allowing a battery to travel alongside the cavalry."
 esprit_de_corps: "Esprit de Corps"
 esprit_de_corps_desc: "The regiment hands down its distinctions and stories, asking each recruit to uphold the name carried on its colors."
 justified_conflicts: "Justified Conflicts"
 justified_conflicts_desc: "Ministers publish memorials laying out inherited claims, broken treaties, and the grounds upon which the sovereign takes up arms."
 archipelago_frigate: "Archipelago Frigate"
 archipelago_frigate_desc: "Shallow-draught frigates fitted for oars as well as sail serve among islands where a ship of the line cannot follow."
 east_indiaman: "East Indiaman"
 east_indiaman_desc: "The great chartered companies send armed merchant ships around the Cape with holds built for the long trade."
 heavy_frigate: "Heavy Frigate"
 heavy_frigate_desc: "Builders lay down larger frigates capable of carrying an unusually weighty battery on their main deck."
 three_decker: "Three-Decker"
 three_decker_desc: "Three tiers of guns rise above the waterline of the great ships that carry an admiral's flag."
 light_dragoon: "Light Dragoon"
 light_dragoon_desc: "Light dragoon regiments combine mounted patrol duty with the ability to serve on foot when the ground demands it."
 elite_training: "Elite Training"
 elite_training_desc: "Picked troops rehearse difficult movements until officers can rely on them amid the noise and confusion of a field action."
