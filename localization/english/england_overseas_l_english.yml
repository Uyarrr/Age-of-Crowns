l_english:
 company_aoc_england_east_india: "East India Company"
 company_aoc_england_east_india_desc: "A royal charter unites the capital of English merchants behind trade in Indian textiles and tea. Its factories and presidencies remain accountable to the Crown."
 company_aoc_england_hudson_bay: "Hudson’s Bay Company"
 company_aoc_england_hudson_bay_desc: "The Governor and Company of Adventurers of England trading into Hudson’s Bay maintains a network of posts dependent upon Indigenous trappers, guides, and trading partners."
 prestige_good_aoc_england_company_calico: "Company Calicoes"
 prestige_good_aoc_england_company_furs: "Hudson’s Bay Beaver Pelts"
 aoc_england_charter_cape: "The Cape of Good Hope"
 aoc_england_charter_cape_desc: "Organize our directly held Cape possessions under a colonial administration. The first grant provides working premises and initial capital. Later grants transfer newly acquired territory to the same subject."
 aoc_england_charter_cape_tt: "Creates the Cape Colony as our colony, or transfers our newly acquired regional possessions to it. Only territory we directly own is transferred. Founding buildings are granted once. While the chartered subject remains under our rule, it grants +1 company slot."
 aoc_england_charter_east_india: "Charter the East India Company"
 aoc_england_charter_east_india_desc: "Organize our directly held Indian possessions under a royal charter. The first grant provides working premises and initial capital. Later grants transfer newly acquired territory to the same subject."
 aoc_england_charter_east_india_tt: "Creates the East India Company as our chartered company, or transfers our newly acquired regional possessions to it. Only territory we directly own is transferred. Founding buildings are granted once. While the chartered subject remains under our rule, it grants +1 company slot."
 aoc_england_charter_australia: "Establish an Australian Administration"
 aoc_england_charter_australia_desc: "Organize our directly held Australian possessions under a colonial administration. The first grant provides working premises and initial capital. Later grants transfer newly acquired territory to the same subject."
 aoc_england_charter_australia_tt: "Creates Australia as our colony, or transfers our newly acquired regional possessions to it. Only territory we directly own is transferred. Founding buildings are granted once. While the chartered subject remains under our rule, it grants +1 company slot."
 aoc_england_charter_new_zealand: "Establish a New Zealand Administration"
 aoc_england_charter_new_zealand_desc: "Organize our directly held New Zealand possessions under a colonial administration. The first grant provides working premises and initial capital. Later grants transfer newly acquired territory to the same subject."
 aoc_england_charter_new_zealand_tt: "Creates New Zealand as our colony, or transfers our newly acquired regional possessions to it. Only territory we directly own is transferred. Founding buildings are granted once. While the chartered subject remains under our rule, it grants +1 company slot."
 aoc_england_charter_hudson_bay: "Grant the Hudson’s Bay Charter"
 aoc_england_charter_hudson_bay_desc: "Organize our directly held Canadian interior possessions under a royal charter. The first grant provides working premises and initial capital. Later grants transfer newly acquired territory to the same subject."
 aoc_england_charter_hudson_bay_tt: "Creates Hudson’s Bay Company as our chartered company, or transfers our newly acquired regional possessions to it. Only territory we directly own is transferred. Founding buildings are granted once. While the chartered subject remains under our rule, it grants +1 company slot."
 aoc_england_cape_developed_tt: "Our subject Cape Colony owns the entire Cape state, has at least 150,000 inhabitants, £750,000 GDP, 25% GDP growth since its first charter assessment, and a Standard of Living of at least 10."
 je_aoc_england_cape: "The Cape of Good Hope"
 je_aoc_england_cape_reason: "A settlement at the Cape can provision fleets bound for India. Establish a working port, then develop the colony’s farms, population, and revenues."
 je_aoc_england_cape_status: "The eastern passage opens at 25,000 Cape inhabitants, £100,000 GDP, and a port. Complete the larger colonial development objective to secure the full reward."
 aoc_england_cape_outcome: "The eastern route opens at 25,000 inhabitants, £100,000 GDP, and a working port in our Cape subject, granting 25 years of trade support and unlocking the Indian charter. Full development grants a further 25 years of Cape prosperity."
 aoc_england_indian_presidencies_tt: "Our chartered East India Company holds land in at least three different Indian state regions, with at least 250,000 inhabitants and £500,000 GDP."
 je_aoc_england_east_india: "The East India Company"
 je_aoc_england_east_india_reason: "A royal charter can turn our Indian footholds into a lasting trading enterprise. Establish the Company and secure three productive possessions."
 je_aoc_england_east_india_status: "Establish the Company and hold three distinct Indian state regions, with at least 250,000 inhabitants and £500,000 GDP. The next venture awaits beyond the eastern seas."
 aoc_england_east_india_outcome: "Three Indian possessions secure the Company’s trade for 25 years and unlock the Australian and New Zealand administrations."
 aoc_england_australia_developed_tt: "The Crown and its subjects own at least 50% of Australia’s provinces. Our Australian subject has at least 300,000 inhabitants, £1,500,000 GDP, and a Standard of Living of 10."
 aoc_england_new_zealand_developed_tt: "The Crown and its subjects own at least 50% of New Zealand’s provinces. Our New Zealand subject has at least 80,000 inhabitants, £400,000 GDP, and a Standard of Living of 10."
 je_aoc_england_australasia: "Australia and New Zealand"
 je_aoc_england_australasia_reason: "Our eastern stations open the southern oceans to settlement. Establish separate governments in Australia and New Zealand, then develop their economies. Indigenous peoples already command the lands and routes our settlers seek."
 je_aoc_england_australasia_status: "Establish Australia and New Zealand as separate colonies. Develop their population and economies, and secure at least half of each region."
 aoc_england_australasia_outcome: "Grants 25 years of Southern Cross trade and migration bonuses to the Crown, and 25 years of settlement support to Australia and New Zealand."
 aoc_england_hudson_bay_developed_tt: "Our chartered Hudson’s Bay Company holds land in three Canadian interior state regions, has 100,000 inhabitants and £400,000 GDP, and operates at least five hunting-lodge levels at 50% employment or more."
 je_aoc_england_hudson_bay: "The Hudson’s Bay Company"
 je_aoc_england_hudson_bay_reason: "A chartered company can maintain trading posts along the routes into Hudson’s Bay. Its fur trade will depend on Indigenous trappers, reliable supplies, and access to European markets."
 je_aoc_england_hudson_bay_status: "Secure three inland possessions and build a working fur economy: 100,000 inhabitants, £400,000 GDP, and a hunting lodge of at least five levels with 50% employment."
 aoc_england_hudson_bay_outcome: "Grants the Crown 25 years of fur-trade dividends and prestige. The charter creates a distinct company whose hunting lodges can produce Hudson’s Bay Beaver Pelts as a prestige good."
 aoc_england_navy_decade_tt: "Current progress: #v [JournalEntry.GetCountry.MakeScope.Var('aoc_england_navy_months').GetValue|0]#!/120 months. Remain among the top three countries by naval power projection and naval-supplies production for 120 consecutive monthly assessments. A working shipyard is required. Falling below either rank resets the count."
 je_aoc_england_royal_navy: "Expand the Royal Navy"
 je_aoc_england_royal_navy_reason: "Our overseas possessions depend on secure sea lanes. Keep the fleet and naval-supplies industry among the world’s three strongest for ten consecutive years."
 je_aoc_england_royal_navy_status: "Maintain a top-three navy and top-three naval-supplies production for ten consecutive years."
 aoc_england_royal_navy_outcome: "Grants 25 years of naval combat, convoy protection, military production, and prestige bonuses."
 aoc_england_new_world_territory_tt: "The Crown and its subjects hold land in at least 35 distinct American state regions, including eight in North America and six in Central America. At least four direct colonial or chartered-company subjects must each possess American land."
 aoc_england_new_world_economy_tt: "Our American possessions and those of our subjects have a combined population of at least 5 million and GDP of £20 million, with ten states each operating an agricultural, extraction, or manufacturing building of level 5 or higher at 75% employment."
 je_aoc_england_new_world: "Dominate the New World"
 je_aoc_england_new_world_reason: "A lasting Atlantic empire needs populous colonies, productive farms and workshops, and several regional governments. Build the territory and economy to sustain that ambition."
 je_aoc_england_new_world_status: "Build an Atlantic empire of at least four colonial administrations, 35 American state regions, five million inhabitants, and £20 million in American GDP."
 aoc_england_new_world_outcome: "Grants 25 years of exceptional prestige, construction capacity, manufacturing and plantation throughput, convoy capacity, and administrative efficiency."
 aoc_england_cape_route: "The Cape Passage"
 aoc_england_cape_prosperity: "A Flourishing Cape"
 aoc_england_india_trade: "The Indian Investment"
 aoc_england_southern_cross: "Under the Southern Cross"
 aoc_england_settlement_support: "Southern Settlement Grants"
 aoc_england_bay_dividends: "Dividends from the Bay"
 aoc_england_wooden_walls: "The Wooden Walls of the Realm"
 aoc_england_atlantic_dominion: "Mistress of the Atlantic"
 england_overseas.1.t: "The Road beyond the Cape"
 england_overseas.1.d: "The Cape Colony can now provision the eastern passage. Merchants petition for permission to establish a company trading into the East Indies."
 england_overseas.1.f: "The harbour’s first promise is modest: water, provisions, and repairs for the next ship east."
 england_overseas.1.a: "Let the eastern trade begin."
 england_overseas.1.tt: "The East India Company journal entry is unlocked. The Cape’s full development objective remains active."
 england_overseas.2.t: "A Colony upon the Cape"
 england_overseas.2.d: "The Cape has acquired the population and revenues to sustain more than a fleet anchorage."
 england_overseas.2.f: "Farms supply the anchorage, workshops serve the fleets, and the governor can at last report revenues to match his obligations."
 england_overseas.2.a: "A settlement worthy of its charge."
 england_overseas.2.tt: "The Crown receives A Flourishing Cape for 25 years."
 england_overseas.3.t: "The Three Presidencies"
 england_overseas.3.d: "Three Indian possessions now sustain the Company’s establishment and open the next stage of our eastern enterprise."
 england_overseas.3.f: "Behind the directors’ accounts lie agreements with Indian rulers, local merchants, and the workers who keep the factories supplied."
 england_overseas.3.a: "Send instructions to the southern seas."
 england_overseas.3.tt: "The Crown receives The Indian Investment for 25 years. Australia and New Zealand are unlocked."
 england_overseas.4.t: "Governments beneath the Southern Cross"
 england_overseas.4.d: "Australia and New Zealand have become substantial colonial economies under separate administrations."
 england_overseas.4.f: "The governors’ dispatches now concern harvests, revenues, and disputes over land. Distance has not diminished the demands of government."
 england_overseas.4.a: "Let their prosperity endure."
 england_overseas.4.tt: "The Crown, Australia, and New Zealand receive their settlement and trade rewards for 25 years."
 england_overseas.5.t: "The Returns of the Adventurers"
 england_overseas.5.d: "The Company’s inland posts now support a substantial trade in furs."
 england_overseas.5.f: "The pelts reach the coastal forts by routes known to the Company’s Indigenous trading partners. Without them, the charter would earn little."
 england_overseas.5.a: "The charter has borne fruit."
 england_overseas.5.tt: "The Crown receives Dividends from the Bay for 25 years."
 england_overseas.6.t: "A Navy Kept in Readiness"
 england_overseas.6.d: "For a decade our fleet and naval-supplies industry have remained among the foremost in the world."
 england_overseas.6.f: "A decade’s accounts record timber, cordage, wages, and repairs. At sea, those expenses have become dependable ships."
 england_overseas.6.a: "Keep the sea lanes open."
 england_overseas.6.tt: "The Crown receives The Wooden Walls of the Realm for 25 years."
 england_overseas.7.t: "The Atlantic System"
 england_overseas.7.d: "A network of populous, productive colonies now binds the New World to our ports."
 england_overseas.7.f: "Cargoes cross the Atlantic under many colonial seals. Their combined value now carries weight in every European counting house."
 england_overseas.7.a: "An ocean joins our dominions."
 england_overseas.7.tt: "The Crown receives Mistress of the Atlantic for 25 years."
 aoc_england_cape_route_requirements: "The Cape route opens once our Cape Colony subject has 25,000 inhabitants, £100,000 GDP, and a port. Full completion additionally requires the whole Cape state, 150,000 inhabitants, £750,000 GDP, 25% GDP growth, and Standard of Living 10."
 aoc_england_cape_colony_name: "Cape Colony"
 aoc_england_cape_colony_adjective: "Cape"
 aoc_england_east_india_name: "East India Company"
 aoc_england_east_india_adjective: "Company"
 je_aoc_england_australasia_progress_status: "Australian provinces: #v [JournalEntry.GetCountry.MakeScope.Var('aoc_england_australia_owned').GetValue|0]#!/#v [JournalEntry.GetCountry.MakeScope.Var('aoc_england_australia_total').GetValue|0]#!. New Zealand provinces: #v [JournalEntry.GetCountry.MakeScope.Var('aoc_england_new_zealand_owned').GetValue|0]#!/#v [JournalEntry.GetCountry.MakeScope.Var('aoc_england_new_zealand_total').GetValue|0]#!. Each region requires 50% ownership, alongside the colonial population, GDP, and living-standard objectives."
 je_aoc_england_royal_navy_progress_status: "Naval readiness maintained: #v [JournalEntry.GetCountry.MakeScope.Var('aoc_england_navy_months').GetValue|0]#!/#v 120#! months. Both naval power and naval-supplies production must remain among the top three; a working shipyard must remain in service. Any failure resets the count."
 je_aoc_england_new_world_progress_status: "Our American possessions: #v [JournalEntry.GetCountry.MakeScope.Var('aoc_england_new_world_population').GetValue|0]#! inhabitants and #v £[JournalEntry.GetCountry.MakeScope.Var('aoc_england_new_world_gdp').GetValue|0]#! GDP. Required: 5 million inhabitants, £20 million GDP, 35 distinct state regions, four colonial administrations, and ten substantial centres of production."
 aoc_england_india_unlocked_tt: "Establish a working Cape station to open the route to India."
 aoc_england_australasia_unlocked_tt: "Complete The East India Company to open the route to Australia and New Zealand."
 aoc_england_bay_completed_tt: "Complete The Hudson’s Bay Company."
 aoc_england_navy_completed_tt: "Complete Expand the Royal Navy."

 aoc_england_east_india_company_slot: "East India Company Charter"
