l_english:
 england_wool_staple_system: "Wool Staple System"
 england_wool_staple_system_desc: "The Crown channels the wool trade through designated staple markets, giving merchants a reliable outlet for English fleece and encouraging sheep farming."
 england_magna_carta: "Magna Carta"
 england_magna_carta_desc: "The Great Charter binds the Crown to established rights and procedures. Its authority endures as a measure against which royal government may be judged."
 england_longbowman: "English Longbowmen"
 england_longbowman_desc: "Years of archery practice produce bowmen capable of sustaining a punishing volley. Their range and rate of fire give English armies a distinctive strength in battle."
 england_cinque_port: "Cinque Ports"
 england_cinque_port_desc: "The privileged Channel ports furnish ships and crews in return for liberties granted by the Crown. Their service forms an early basis for organized maritime defense."
 england_lionhearts: "Lionhearts"
 england_lionhearts_desc: "The martial ideal of a king who leads from the front inspires confidence among heavily armed retainers. Resolve in the charge and steadiness in defense become marks of the English host."
 england_dominions: "English Dominions"
 england_dominions_desc: "The Crown establishes self-governing overseas realms that manage their own affairs and wars while maintaining allegiance and a modest tribute."
 subject_type_english_dominion: "@dominion! $subject_type_english_dominion_no_icon$"
 subject_type_english_dominion_no_icon: "English Dominion"
 english_dominion: "English Dominion"
 english_dominion_desc: "An autonomous realm of the English Crown. It pays 15% of its income to its overlord, may wage its own wars, and does not automatically join the overlord's wars."
 aoc_content_unlock_english_dominion: "Unlocks English Dominion (Subject Type)"
 dp_make_english_dominion: "$war_goal_make_english_dominion_type_name$"
 dp_make_english_dominion_desc: "Establish an English Dominion under the Crown. Requires $england_dominions$."
 war_goal_make_english_dominion_type_name: "Make English Dominion"
 war_goal_make_english_dominion_type_desc: "Force another country to become an English Dominion. Requires $england_dominions$."
 war_goal_make_english_dominion: "[WAR_GOAL_DRAFT.GetTarget.GetName] English Dominion"
 war_goal_make_english_dominion_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName] forces [WAR_GOAL_DRAFT.GetTarget.GetName] to become an English Dominion."
 war_goal_make_english_dominion_sway_desc: "Offer an English Dominion under [WAR_GOAL_DRAFT.GetHolder.GetName] in return for joining your side."
 england_royal_dockyards: "Royal Dockyards"
 england_royal_dockyards_desc: "Permanent dockyards bring shipwrights, stores, and repair facilities under royal direction. This concentration of skill supports a larger and more dependable fleet."
 england_reformed_longbowman: "Reformed Longbowmen"
 england_reformed_longbowman_desc: "Refined training and battlefield organization keep the longbow effective as armies change around it. Experienced archers deliver disciplined volleys in support of the main line."
 england_renaissance: "English Renaissance"
 england_renaissance_desc: "Humanist learning and new methods of inquiry spread through the realm. Scholars and patrons turn imported ideas into a vigorous English intellectual culture."
 england_secretaries_of_state: "Secretaries of State"
 england_secretaries_of_state_desc: "Specialized secretaries manage the Crown's correspondence with foreign courts and its agents at home. Regular channels of information give diplomacy greater reach."
 england_military_4: "Professional Gunnery"
 england_military_4_desc: "Gunsmiths and military artificers adopt more consistent methods of manufacture. Reliable firearms become easier to supply to an expanding army."
 england_coke_smelting: "Coke Smelting"
 england_coke_smelting_desc: "Coal processed into coke can fire furnaces without exhausting nearby woodland. A steadier supply of metal supports the workshops that equip a growing economy."
 england_the_sick_and_hurt_board: "Sick and Hurt Board"
 england_the_sick_and_hurt_board_desc: "A dedicated naval board arranges care for sick and wounded seamen. Better provision reduces the burden of maintaining fleets on prolonged service."
 england_palladian_architecture: "Palladian Architecture"
 england_palladian_architecture_desc: "Classical proportions and orderly plans guide a new generation of public buildings and country houses. Standardized designs help builders carry ambitious works to completion."
 england_water_frame: "Water Frame"
 england_water_frame_desc: "Water-powered frames spin cotton continuously and at scale. Textile production moves from scattered households toward mills organized around machinery."
 england_rulers_of_the_waves: "Rulers of the Waves"
 england_rulers_of_the_waves_desc: "A fleet trained to control sea lanes can close enemy ports and cut their commerce. Command of the water becomes an instrument of pressure far beyond the battlefield."
 england_seed_drill: "Seed Drill"
 england_seed_drill_desc: "Mechanical drills place seed at regular depth and spacing, reducing waste and improving cultivation. Their use encourages more systematic farming across the countryside."
