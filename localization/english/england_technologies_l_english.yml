l_english:
 england_wool_staple_system: "Wool Staple System"
 england_wool_staple_system_desc: "English wool passes through designated staple towns, where merchants bargain for fleeces and the Crown collects its dues."
 england_magna_carta: "Magna Carta"
 england_magna_carta_desc: "The Great Charter binds the Crown to established rights and procedures. Its authority endures as a measure against which royal government may be judged."
 england_longbowman: "English Longbowmen"
 england_longbowman_desc: "Shire musters call for men who have practiced at the butts, with bows and sheaves of arrows ready for service."
 england_cinque_port: "Cinque Ports"
 england_cinque_port_desc: "The privileged Channel ports furnish ships and crews in return for liberties granted by the Crown. Their service forms an early basis for organized maritime defense."
 england_lionhearts: "Lionhearts"
 england_lionhearts_desc: "Tales of the Lionheart are told wherever a lord is expected to lead his own retinue into the press of battle."
 england_dominions: "English Dominions"
 england_dominions_desc: "Overseas assemblies claim the right to conduct their own affairs while acknowledging the same Crown."
 subject_type_english_dominion: "@dominion! $subject_type_english_dominion_no_icon$"
 subject_type_english_dominion_no_icon: "English Dominion"
 english_dominion: "English Dominion"
 english_dominion_desc: "An autonomous realm of the English Crown. It pays 15% of its income to its overlord, may wage its own wars, and does not automatically join the overlord's wars."
 aoc_content_unlock_english_dominion: "Unlocks English Dominion (Subject Type)"
 dp_make_english_dominion: "$war_goal_make_english_dominion_type_name$"
 dp_make_english_dominion_desc: "Establish an English Dominion under the Crown. Requires $england_dominions$."
 war_goal_make_english_dominion_type_name: "Make English Dominion"
 war_goal_make_english_dominion_type_desc: "Force another country to become an English Dominion. Requires $england_dominions$."
 war_goal_make_english_dominion: "[WAR_GOAL_DRAFT.GetTarget.GetName] English Dominion"
 war_goal_make_english_dominion_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName] forces [WAR_GOAL_DRAFT.GetTarget.GetName] to become an English Dominion."
 war_goal_make_english_dominion_sway_desc: "Offer an English Dominion under [WAR_GOAL_DRAFT.GetHolder.GetName] in return for joining your side."
 england_royal_dockyards: "Royal Dockyards"
 england_royal_dockyards_desc: "The Crown maintains slips, storehouses, and workshops where its ships can be laid up, repaired, and fitted for sea."
 england_reformed_longbowman: "Reformed Longbowmen"
 england_reformed_longbowman_desc: "English captains retain experienced bowmen and drill them to take their place beside pike and shot."
 england_renaissance: "English Renaissance"
 england_renaissance_desc: "Humanists bring classical texts into English schools and households, where translators give them new readers."
 england_secretaries_of_state: "Secretaries of State"
 england_secretaries_of_state_desc: "The Crown's secretaries answer dispatches from foreign courts and keep a record of the instructions sent to its agents abroad."
 england_military_4: "Professional Gunnery"
 england_military_4_desc: "Gunsmiths and military artificers adopt more consistent methods of manufacture. Reliable firearms become easier to supply to an expanding army."
 england_coke_smelting: "Coke Smelting"
 england_coke_smelting_desc: "Ironmasters charge their furnaces with coke made from coal, lifting a constraint long imposed by the supply of charcoal."
 england_the_sick_and_hurt_board: "Sick and Hurt Board"
 england_the_sick_and_hurt_board_desc: "Commissioners arrange for sick and wounded seamen to be received at hospitals and lodgings ashore."
 england_palladian_architecture: "Palladian Architecture"
 england_palladian_architecture_desc: "Architects study Palladio's measured plans and set temple fronts on country houses and public buildings."
 england_water_frame: "Water Frame"
 england_water_frame_desc: "Waterwheels drive rows of rollers that draw out cotton fibers for spinning into strong warp yarn."
 england_rulers_of_the_waves: "Rulers of the Waves"
 england_rulers_of_the_waves_desc: "Squadrons cruise off hostile coasts, keeping watch over the routes by which enemy ports receive their supplies."
 england_seed_drill: "Seed Drill"
 england_seed_drill_desc: "A drill opens furrows and drops seed in rows at a regular depth before covering it with earth."
 england_enclosure_of_common_fields: "Enclosure of Common Fields"
 england_enclosure_of_common_fields_desc: "Landholders join scattered strips into hedged holdings, and households that have long grazed the commons dispute the new bounds."
 england_merchant_adventures: "Merchant Adventurers"
 england_merchant_adventures_desc: "Merchant Adventurers carry English cloth to continental marts and bargain for privileges on behalf of their fellowship."
 england_royal_navy: "Royal Navy"
 england_royal_navy_desc: "The Crown keeps ships in ordinary, with stores and officers appointed to bring them into commission when called upon."
 england_art_of_navigation: "Art of Navigation"
 england_art_of_navigation_desc: "English pilots and their pupils study charts, instruments, and printed sailing directions before undertaking long passages."
 england_the_book_of_common_prayer: "Book of Common Prayer"
 england_the_book_of_common_prayer_desc: "A single book sets down the forms of worship to be read in English parishes, from morning prayer to burial."
 england_the_act_of_supremacy: "Act of Supremacy"
 england_the_act_of_supremacy_desc: "Parliament declares the Crown supreme in ecclesiastical affairs, requiring officeholders to acknowledge its authority by oath."
 england_bill_of_rights: "Bill of Rights"
 england_bill_of_rights_desc: "Parliament sets down the liberties and limits on royal power that accompany the offer of the Crown to William and Mary."
