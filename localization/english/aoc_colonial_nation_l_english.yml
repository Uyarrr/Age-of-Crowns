l_english:
 law_colonial_nation: "Colonial Nation"
 law_colonial_nation_desc: "A nation founded through colonial settlement, with institutions that encourage a larger share of its population to join the workforce. This reform is available only to present and former colonial nations."
 aoc_colonial_settlement_protection: "Colonial Settlement Protection"
 aoc_colonial_settlement_protection_desc: "For fifteen years after establishment, the colonial administration receives support to contain revolutions and secessions and keep liberty desire low while its institutions take root."
