 aoc_content_details_aoc_hyw_299: "#title Script details#!\n#v aoc_hyw.299#!\n\n#bold Event trigger#!\n• c:FRA ?= this\n• NOT = { has_variable = aoc_hyw_france_intro_seen }\n\n#bold Firing sources#!\naoc_hyw_opening_events\n  • aoc_hyw_crowns_available = yes\n  • NOT = { has_global_variable = aoc_hyw_concluded }\n  • NOT = { has_variable = aoc_hyw_france_intro_seen }\n\n#bold Effects when the event opens#!\n• set_variable = aoc_hyw_france_intro_seen\n\n#bold $aoc_hyw_france_intro_option$#!\nNo additional scripted effect."
 aoc_content_player_aoc_hyw_299: "#v #bold $aoc_hyw_france_intro_title$#!#!\n$aoc_hyw_france_intro_desc$\n$TOOLTIP_DELIMITER$\n#header Option 1 · $aoc_hyw_france_intro_option$#!\nNo additional effects."
 aoc_content_details_aoc_hyw_300: "#title Script details#!\n#v aoc_hyw.300#!\n\n#bold Firing sources#!\nje_england_1\n  • custom_tooltip = { text = aoc_hyw_france_victory_condition scope:journal_entry = { var:aoc_hyw_french_wins >= 3 } }\n\nCan fire only once.\n\n#bold $aoc_hyw_france_victory_option$#!\n• Event country receives [GetStaticModifier('hundred_years_war_france_won').GetName] (years: 20)\n[GetStaticModifier('hundred_years_war_france_won').GetDesc]"
 aoc_content_player_aoc_hyw_300: "#v #bold $aoc_hyw_france_victory_title$#!#!\n$aoc_hyw_france_victory_event_desc$\n$TOOLTIP_DELIMITER$\n#header Option 1 · $aoc_hyw_france_victory_option$#!\n• #v [GetStaticModifier('hundred_years_war_france_won').GetName]#! for #v 20 years#!#indent_newline:3 \n[GetStaticModifier('hundred_years_war_france_won').GetDesc]#!"
 aoc_content_details_aoc_hyw_301: "#title Script details#!\n#v aoc_hyw.301#!\n\n#bold Firing sources#!\nje_england_1\n  • custom_tooltip = { text = aoc_hyw_england_victory_condition scope:journal_entry = { var:aoc_hyw_english_wins >= 3 } }\n\nCan fire only once.\n\n#bold $aoc_hyw_france_defeat_option$#!\n• Event country receives [GetStaticModifier('hundred_years_war_france_lost').GetName] (years: 20)\n[GetStaticModifier('hundred_years_war_france_lost').GetDesc]"
 aoc_content_player_aoc_hyw_301: "#v #bold $aoc_hyw_france_defeat_title$#!#!\n$aoc_hyw_france_defeat_event_desc$\n$TOOLTIP_DELIMITER$\n#header Option 1 · $aoc_hyw_france_defeat_option$#!\n• #v [GetStaticModifier('hundred_years_war_france_lost').GetName]#! for #v 20 years#!#indent_newline:3 \n[GetStaticModifier('hundred_years_war_france_lost').GetDesc]#!"
 aoc_content_when_aoc_hyw_311: "England agrees to surrender Maine in The Surrender of Maine. France receives this event when it annexes Maine."
 aoc_content_details_aoc_hyw_311: "#title Script details#!\n#v aoc_hyw.311#!\n$aoc_content_when_aoc_hyw_311$\n\n#bold Firing sources#!\naoc_hyw.310\n  • c:ENG ?= this\n  • aoc_hyw_crowns_available = yes\n  • c:MIE ?= { is_subject_of = c:ENG }\n  • exists = c:FRA\n  • c:MIE ?= { is_subject_of = c:ENG }\n\nCan fire only once.\n\n#bold $aoc_hyw_maine_returned_option$#!\nNo additional scripted effect."
 aoc_content_player_aoc_hyw_311: "#v #bold $aoc_hyw_maine_returned_title$#!#!\n$aoc_hyw_maine_returned_desc$\n$TOOLTIP_DELIMITER$\n#bold When it can happen#!\n$aoc_content_when_aoc_hyw_311$\n$TOOLTIP_DELIMITER$\n#header Option 1 · $aoc_hyw_maine_returned_option$#!\nNo additional effects."
 aoc_content_when_aoc_hyw_312: "England refuses to surrender Maine while Maine is still under English protection."
 aoc_content_details_aoc_hyw_312: "#title Script details#!\n#v aoc_hyw.312#!\n$aoc_content_when_aoc_hyw_312$\n\n#bold Firing sources#!\naoc_hyw.310\n  • c:ENG ?= this\n  • aoc_hyw_crowns_available = yes\n  • c:MIE ?= { is_subject_of = c:ENG }\n  • exists = c:FRA\n  • c:MIE ?= { is_subject_of = c:ENG }\n\nCan fire only once.\n\n#bold $aoc_hyw_maine_denied_option$#!\nNo additional scripted effect."
 aoc_content_player_aoc_hyw_312: "#v #bold $aoc_hyw_maine_denied_title$#!#!\n$aoc_hyw_maine_denied_desc$\n$TOOLTIP_DELIMITER$\n#bold When it can happen#!\n$aoc_content_when_aoc_hyw_312$\n$TOOLTIP_DELIMITER$\n#header Option 1 · $aoc_hyw_maine_denied_option$#!\nNo additional effects."
 aoc_content_when_france_east_india_1: "Complete $je_aoc_england_east_india$ as France after chartering the Compagnie des Indes."
 aoc_content_details_france_east_india_1: "#title Script details#!\n#v france_east_india.1#!\n$aoc_content_when_france_east_india_1$\n\n#bold Firing sources#!\nje_aoc_england_east_india\n  • custom_tooltip = { text = aoc_england_indian_presidencies_tt OR = { AND = { aoc_england_overseas_country = yes aoc_east_india_presidencies = { TAG = BIC COMPANY = company_aoc_england_east_india } } AND = { aoc_french_east_india_sponsor = yes aoc_east_india_presidencies = { TAG = FIC COMPANY = company_aoc_france_east_india } } } }\n\n#bold $france_east_india.1.a$#!\nNo additional scripted effect."
 aoc_content_player_france_east_india_1: "#v #bold $france_east_india.1.t$#!#!\n$TOOLTIP_DELIMITER$\n#bold When it can happen#!\n$aoc_content_when_france_east_india_1$\n$TOOLTIP_DELIMITER$\n#header Option 1 · $france_east_india.1.a$#!\nNo additional effects."
 aoc_content_when_national_colonization_3: "As independent France, research $colonization$ and $colonial_trade_networks$."
 aoc_content_details_national_colonization_3: "#title Script details#!\n#v national_colonization.3#!\n$aoc_content_when_national_colonization_3$\n\n#bold Event trigger#!\n• has_technology_researched = colonization\n• has_technology_researched = colonial_trade_networks\n• is_subject = no\n• OR = { c:FRA ?= this was_formed_from = FRA }\n\n#bold Firing sources#!\non_yearly_pulse_country\non_acquired_technology\n\ncooldown = { days = never_fire_again_modifier_time }\n\n#bold $national_colonization.3.a$#!\n• set_variable = aoc_french_canada_phase\n• add_involvement = { strategic_region = sr:region_canada value = 2000 }\n• Event country receives [GetStaticModifier('colonial_rush').GetName] (years: 10)\n[GetStaticModifier('colonial_rush').GetDesc]\n• activate_law = law_type:law_colonial_resettlement\n\n#bold $national_colonization.3.b$#!\nNo additional scripted effect."
 aoc_content_player_national_colonization_3: "#v #bold $national_colonization.3.t$#!#!\n$national_colonization.3.d$\n$TOOLTIP_DELIMITER$\n#bold When it can happen#!\n$aoc_content_when_national_colonization_3$\n$TOOLTIP_DELIMITER$\n#header Option 1 · $national_colonization.3.a$#!\n• Begin the French colonial effort in Canada\n• #p +2,000#! [concept_involvement] in $region_canada$\n• #v [GetStaticModifier('colonial_rush').GetName]#! for #v 10 years#!#indent_newline:3 \n[GetStaticModifier('colonial_rush').GetDesc]#!\n• Enact $law_colonial_resettlement$\n$TOOLTIP_DELIMITER$\n#header Option 2 · $national_colonization.3.b$#!\nNo additional effects."
