 aoc_content_briefing_aoc_france_2: "France looks to the Ottoman court for an ally against the Habsburgs."
 aoc_content_when_aoc_france_2: "From Early Discovery until Era 3 research is complete, France has a 20% annual chance if it can negotiate an alliance with the Ottomans."
 aoc_content_details_aoc_france_2: "#title Script details#!\n#v aoc_france.2#!\n$aoc_content_when_aoc_france_2$\n\n#bold Event trigger#!\n• c:FRA ?= this\n• aoc_era_research_early = { ERA = 3 }\n• aoc_era_event_window_open = { ERA = 3 }\n• aoc_france_can_offer_ottoman_alliance = yes\n\n#bold Firing sources#!\naoc_france_ottoman_alliance_yearly\n  • c:FRA ?= this\n\nCan fire only once.\n\n#bold Effects when the event opens#!\n• save_scope_as = aoc_france_envoys\n• c:TUR = { save_scope_as = aoc_france_ottoman_court }\n\n#bold $aoc_france_ottoman_alliance.a$#!\n• trigger = { aoc_france_can_offer_ottoman_alliance = yes }\n• if = { limit = { NOT = { has_strategic_region_interest_tier = { strategic_region = scope:aoc_france_ottoman_court.capital.region value >= 2 } } } add_involvement = { strategic_region = scope:aoc_france_ottoman_court.capital.region value = 2500 } }\n• scope:aoc_france_ottoman_court = { trigger_event = { id = aoc_france.9 popup = yes } }\n\n#bold $aoc_france_ottoman_alliance.b$#!\nNo additional scripted effect."
