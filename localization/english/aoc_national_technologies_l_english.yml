 aoc_content_briefing_national_colonization_3: "French navigators look to the Saint Lawrence for a foothold in North America."
 aoc_content_when_national_colonization_3: "As independent France, research $colonization$ and $colonial_trade_networks$."
 aoc_content_details_national_colonization_3: "#title Script details#!\n#v national_colonization.3#!\n$aoc_content_when_national_colonization_3$\n\n#bold Event trigger#!\n• has_technology_researched = colonization\n• has_technology_researched = colonial_trade_networks\n• is_subject = no\n• OR = { c:FRA ?= this was_formed_from = FRA }\n\n#bold Firing sources#!\non_yearly_pulse_country\non_acquired_technology\n\ncooldown = { days = never_fire_again_modifier_time }\n\n#bold $national_colonization.3.a$#!\n• set_variable = aoc_french_canada_phase\n• add_involvement = { strategic_region = sr:region_canada value = 2000 }\n• Event country receives [GetStaticModifier('colonial_rush').GetName] (years: 10)\n[GetStaticModifier('colonial_rush').GetDesc]\n• activate_law = law_type:law_colonial_resettlement\n\n#bold $national_colonization.3.b$#!\nNo additional scripted effect."
 aoc_content_player_national_colonization_3: "#v #bold $national_colonization.3.t$#!#!\n$national_colonization.3.d$\n$TOOLTIP_DELIMITER$\n#bold When it can happen#!\n$aoc_content_when_national_colonization_3$\n$TOOLTIP_DELIMITER$\n#header Option 1 · $national_colonization.3.a$#!\n• Begin the French colonial effort in Canada\n• #p +2,000#! [concept_involvement] in $region_canada$\n• #v [GetStaticModifier('colonial_rush').GetName]#! for #v 10 years#!#indent_newline:3 \n[GetStaticModifier('colonial_rush').GetDesc]#!\n• Enact $law_colonial_resettlement$\n$TOOLTIP_DELIMITER$\n#header Option 2 · $national_colonization.3.b$#!\nNo additional effects."
