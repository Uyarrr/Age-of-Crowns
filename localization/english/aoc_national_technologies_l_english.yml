 aoc_content_briefing_aoc_france_1: "The Crown brings royal justice closer to the provinces."
 aoc_content_when_aoc_france_1: "France has a 20% annual chance after reaching Early Discovery. The window opens at 25% of regular Era 3 research and closes once France completes all regular Era 3 technologies."
