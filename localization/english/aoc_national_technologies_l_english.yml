 aoc_content_details_national_colonization_3: "#title Script details#!\n#v national_colonization.3#!\n\n#bold Event trigger#!\n• has_technology_researched = colonization\n• has_technology_researched = colonial_trade_networks\n• is_subject = no\n• OR = { c:FRA ?= this was_formed_from = FRA }\n\n#bold Firing sources#!\non_yearly_pulse_country\non_acquired_technology\n\ncooldown = { days = never_fire_again_modifier_time }\n\n#bold $national_colonization.3.a$#!\n• set_variable = aoc_french_canada_phase\n• add_involvement = { strategic_region = sr:region_canada value = 2000 }\n• Event country receives [GetStaticModifier('colonial_rush').GetName] (years: 10)\n[GetStaticModifier('colonial_rush').GetDesc]\n• activate_law = law_type:law_colonial_resettlement\n\n#bold $national_colonization.3.b$#!\nNo additional scripted effect."
 aoc_content_player_national_colonization_3: "#v #bold $national_colonization.3.t$#!#!\n$national_colonization.3.d$\n$TOOLTIP_DELIMITER$\n#bold Event choices#!\n#v #bold $national_colonization.3.a$#!#!\n#v +2,000#! [concept_involvement] in $region_canada$\n[GetStaticModifier('colonial_rush').GetName] · Your country · #v 10 years#!\n[GetStaticModifier('colonial_rush').GetDesc]\nEnact $law_colonial_resettlement$\nSee the information icon for additional effects and conditions.\n\n#v #bold $national_colonization.3.b$#!#!\nNo additional effects."
