l_english:
 HOLY_ROMAN_EMPIRE: "Holy Roman Empire"
 identity_holy_roman_empire: "Holy Roman Empire"
 identity_holy_roman_empire_desc: "A loose confederation of kingdoms, duchies, and free cities in Central Europe, bound together under the authority of an elected Emperor. While its unity is fragile and its members fiercely independent, the Empire endures as a political and cultural force, balancing tradition, diplomacy, and power."

 JAPANESE_SHOGUNATE: "Japanese Shogunate"
 identity_japanese_shogunate: "Japanese Shogunate"
 identity_japanese_shogunate_desc: "A decentralized military government headed by the Shogun, whose authority rests upon the loyalty of the daimyo. While the great clans formally serve the realm, rivalries and competing ambitions threaten to fracture the country. Only a strong leader can preserve order and unite Japan under a single banner."
 MANDATE_OF_HEAVEN: "Mandate of Heaven"
 identity_chinese_empire: "Mandate of Heaven"
 identity_chinese_empire_desc: "The Son of Heaven presides over the Chinese realm and its tributary subjects. The Mandate cannot be founded through ordinary diplomacy or disbanded by its emperor; its fate is determined by the events of the realm."
 IRISH_CLANS: "Irish Clans"
 identity_irish_clans: "Irish Clans"
 identity_irish_clans_desc: "The Gaelic clans of Ireland gather in a common council, preserving their ancestral lordships while coordinating the maintenance of order."
 SUNNI_CALIPHATE: "Sunni Caliphate"
 identity_sunni_caliphate: "Sunni Caliphate"
 identity_sunni_caliphate_desc: "The Sunni realms gather under the authority of the Caliphate, coordinating the preservation of order across the faithful."
 aoc_power_bloc_scripted_formation_only: "Power Blocs can only be established by historical setup or scripted events."
 AOC_POWER_BLOC_COHESION_NON_SUNNI_MEMBERS: "Non-Sunni member states"
