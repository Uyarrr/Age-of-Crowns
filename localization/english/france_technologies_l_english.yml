l_english:
 france_domaine_royal: "Domaine Royal"
 france_domaine_royal_desc: "The Crown consolidates its royal domain, strengthening its direct control over revenues and administration."
 france_elan: "Élan"
 france_elan_desc: "French troops cultivate a spirit of bold action and determination that helps them hold firm under pressure."
 france_consolidation_of_country: "Consolidation of the Realm"
 france_consolidation_of_country_desc: "Royal administration draws the provinces more closely into a unified realm, making their incorporation easier."
 france_appanage_system: "Appanage System"
 france_appanage_system_desc: "Lands granted to royal princes remain tied to the Crown through dynastic obligations and shared institutions."
 france_french_monarchy: "French Monarchy"
 france_french_monarchy_desc: "From the coronation at Reims to the judgments of the Parlement, ancient rites bind the king to the realm he inherits."
 france_ancient_french_taxation: "Ancient French Taxation"
 france_ancient_french_taxation_desc: "The taille has outlived the campaigns that first justified it. Assessors reckon what is owed while towns, estates, and nobles plead their privileges."
 france_french_noble_armies: "French Noble Armies"
 france_french_noble_armies_desc: "The king's banners draw knights from the great households of France, each bringing his lances, retainers, and the honor of his name."
 france_hospices_de_beaune: "Hospices de Beaune"
 france_hospices_de_beaune_desc: "Nicolas Rolin and Guigone de Salins endowed a house in Beaune where the sick poor could find a bed, a meal, and care."
 france_chateau_de_vincennes: "Château de Vincennes"
 france_chateau_de_vincennes_desc: "Charles V raised a great keep east of Paris, turning a hunting lodge into a seat of royal power."
 france_renaissance_gendarmes: "Renaissance Gendarmes"
 france_renaissance_gendarmes_desc: "The Crown musters men-at-arms in standing companies, with each gendarme riding at the head of a lance paid from the royal treasury."
 france_royal_exploration_carrack: "Royal Exploration Carrack"
 france_royal_exploration_carrack_desc: "Shipwrights at the Atlantic ports reckon the long passage in barrels of water, salt provisions, and spare cordage."
 france_parish_registration: "Parish Registration"
 france_parish_registration_desc: "The parish priest enters every baptism in his register, giving families a written witness to births and kinship."
 france_edict_of_nantes: "Edict of Nantes"
 france_edict_of_nantes_desc: "After decades of religious war, the Crown seeks a settlement under which Catholic and Huguenot subjects can again owe allegiance to the same king."
 france_east_india_company: "French East India Company"
 france_east_india_company_desc: "Merchants petition the Crown for a charter to trade beyond the Cape, where the traffic in fine cloth and spices already draws rivals from across Europe."
