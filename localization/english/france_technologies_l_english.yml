l_english:
 france_domaine_royal: "Domaine Royal"
 france_domaine_royal_desc: "The king's officers collect rents and administer justice in lands held directly by the Crown."
 france_elan: "Élan"
 france_elan_desc: "Officers commend the élan of men who keep their resolve as the drums call them forward."
 france_consolidation_of_country: "Consolidation of the Realm"
 france_consolidation_of_country_desc: "Royal officers take up their posts in the provinces, where inherited privileges must be reconciled with the ordinances of the Crown."
 france_appanage_system: "Appanage System"
 france_appanage_system_desc: "Princes of the blood receive lands for their maintenance under grants that provide for their return to the Crown."
 france_french_monarchy: "French Monarchy"
 france_french_monarchy_desc: "From the coronation at Reims to the judgments of the Parlement, ancient rites bind the king to the realm he inherits."
 france_ancient_french_taxation: "Ancient French Taxation"
 france_ancient_french_taxation_desc: "The taille has outlived the campaigns that first justified it. Assessors reckon what is owed while towns, estates, and nobles plead their privileges."
 france_noblesse_d_epee: "Noblesse d'Épée"
 france_noblesse_d_epee_desc: "The king's banners draw knights from the great households of France, each bringing his lances, retainers, and the honor of his name."
 france_chateau_de_vincennes: "Château de Vincennes"
 france_chateau_de_vincennes_desc: "Charles V raised a great keep east of Paris, turning a hunting lodge into a seat of royal power."
 france_renaissance_gendarmes: "Renaissance Gendarmes"
 france_renaissance_gendarmes_desc: "The Crown musters men-at-arms in standing companies, with each gendarme riding at the head of a lance paid from the royal treasury."
 france_royal_exploration_carrack: "Royal Exploration Carrack"
 france_royal_exploration_carrack_desc: "Shipwrights at the Atlantic ports reckon the long passage in barrels of water, salt provisions, and spare cordage."
 france_parish_registration: "Parish Registration"
 france_parish_registration_desc: "The parish priest enters every baptism in his register, giving families a written witness to births and kinship."
 france_edict_of_nantes: "Edict of Nantes"
 france_edict_of_nantes_desc: "After decades of religious war, the Crown seeks a settlement under which Catholic and Huguenot subjects can again owe allegiance to the same king."
 france_east_india_company: "French East India Company"
 france_east_india_company_desc: "Merchants petition the Crown for a charter to trade beyond the Cape, where the traffic in fine cloth and spices already draws rivals from across Europe."

 france_chateau_de_chambord: "Château de Chambord"
 france_chateau_de_chambord_desc: "François I orders a hunting château in Sologne, its lantern tower to rise above the forest."

 france_royal_atlantic_naval_yard: "Royal Atlantic Naval Yard"
 france_royal_atlantic_naval_yard_desc: "The Crown orders permanent slips and storehouses on the Norman coast, with the royal shipwrights to work from stocks of timber and canvas."

 france_academie_francaise: "Académie française"
 france_academie_francaise_desc: "Richelieu secures letters patent for an assembly of writers charged with settling the usage of the French tongue."

 france_palace_of_versailles: "Palace of Versailles"
 france_palace_of_versailles_desc: "Louis XIV summons his ministers and courtiers to Versailles, where the conduct of affairs follows the daily order of the royal household."

 france_louvre_museum: "Louvre Museum"
 france_louvre_museum_desc: "The former royal collections are set aside for a public museum. The great gallery is to admit citizens to paintings once kept for the court."

 france_ecole_polytechnique: "École Polytechnique"
 france_ecole_polytechnique_desc: "A new school in Paris trains engineers in mathematics, drawing, and the sciences for the service of the Republic."

 france_royal_manufactories: "Royal Manufactories"
 france_royal_manufactories_desc: "Under royal patronage, master weavers and cabinetmakers furnish the court and earn a reputation abroad for French workmanship."
 building_luxury_cloth_workshop_throughput_add: "$building_luxury_cloth_workshop$ [concept_throughput]"
 building_luxury_cloth_workshop_throughput_add_desc: "A bonus or penalty to both input and output of $building_luxury_cloth_workshop$"
 building_luxury_furniture_workshop_throughput_add: "$building_luxury_furniture_workshop$ [concept_throughput]"
 building_luxury_furniture_workshop_throughput_add_desc: "A bonus or penalty to both input and output of $building_luxury_furniture_workshop$"
 france_royal_construction_commissions: "Royal Construction Commissions"
 france_royal_construction_commissions_desc: "The Crown commissions architects and masters of works, who draw up estimates and contract for stone, timber, and skilled hands."
 france_establishment_of_recettes_generales: "Establishment of Recettes générales"
 france_establishment_of_recettes_generales_desc: "Receivers-general gather the tax receipts of their districts and render accounts to the royal treasury."
 france_colonial_ventures: "Colonial Ventures"
 france_colonial_ventures_desc: "French captains and merchants seek commissions for voyages and settlements beyond the Atlantic."
 france_atlantic_fisheries: "Atlantic Fisheries"
 france_atlantic_fisheries_desc: "Ships from French Atlantic ports outfit for the Newfoundland banks, carrying salt to preserve their catch for the voyage home."
 france_grasse_perfumed_gloves: "Grasse Perfumed Gloves"
 france_grasse_perfumed_gloves_desc: "Glovemakers in Grasse scent their fine leather with local flowers for customers at court and abroad."
 france_manufacture_royale_des_glaces: "Manufacture royale des glaces"
 france_manufacture_royale_des_glaces_desc: "The Crown grants privileges to a glassworks whose craftsmen make the large mirror plates prized in royal interiors."
 france_bourbon_absolutism: "Bourbon Absolutism"
 france_bourbon_absolutism_desc: "Bourbon ministers exercise the king's authority through councils at court and intendants in the provinces."
 france_académie_royale_des_sciences: "Académie royale des sciences"
 france_académie_royale_des_sciences_desc: "Under royal patronage, mathematicians and natural philosophers meet in Paris to report experiments and examine one another's findings."
 france_the_gribeauval_system: "Gribeauval System"
 france_the_gribeauval_system_desc: "French arsenals adopt common patterns for field guns, carriages, and fittings under Gribeauval's artillery reforms."
 france_elite_gendarmes: "Elite Gendarmes"
 france_elite_gendarmes_desc: "Picked companies of the royal gendarmerie carry the prestige of their noble service into the increasingly regimented cavalry of France."

 france_liberte_egalite_fraternite: "Liberté, Égalité, Fraternité"
 france_liberte_egalite_fraternite_desc: "The watchwords of the Revolution appear on public buildings as citizens debate what liberty, equality, and fraternity demand of the Republic."
 france_grande_armee: "Grande Armée"
 france_grande_armee_desc: "Napoleon organizes his army into corps that can march by separate roads and join forces on the field of battle."
