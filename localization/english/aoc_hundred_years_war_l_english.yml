l_english:
 aoc_hyw_france_intro_title: "The Hundred Years War in France"
 aoc_hyw_france_intro_desc: "The Hundred Years War began in 1337 due to a dispute between our throne and the English house of Plantagenet. During the past century, the war grew in scale and scope, enveloping at times various factions of Western Europe. Recently, the tide has turned, granting our troops the upper hand in reconquering long-lost land from the accursed English king, who now cowers across the Channel. The coming of Joan of Arc and her legendary valor inspired our nation to push ahead with the war effort despite our then-disadvantaged position. Military leaders like Jean Bureau and Jean de Dunois will certainly rout the remaining English influence away from European shores and back from whence they came!"
 aoc_hyw_france_intro_option: "We shall be victorious!"
 dp_aoc_hyw: "The Hundred Years’ War"
 dp_aoc_hyw_desc: "England and France take up arms over their rival rights in France."
 aoc_hyw_supremacy: "Concede the Campaign"
 aoc_hyw_supremacy_desc: "Compel the opposing crown to concede this campaign in the Hundred Years’ War."
 aoc_hyw_invalid_desc: "The contest ended when one of the crowns ceased to rule independently."
 aoc_hyw_english_score: "English Wins [JournalEntry.MakeScope.Var('aoc_hyw_english_wins').GetValue|v0] / 3"
 aoc_hyw_french_score: "French Wins [JournalEntry.MakeScope.Var('aoc_hyw_french_wins').GetValue|v0] / 3"
 aoc_hyw_stalemate_score: "Stalemates [JournalEntry.MakeScope.Var('aoc_hyw_stalemates').GetValue|v0] / 3"
 aoc_hyw_forces_tooltip: "Total battalions and flotillas of the crown and its listed supporters."
 aoc_hyw_withdraw: "Withdraw from the Hundred Years’ War"
 aoc_hyw_withdraw_desc: "Leave the journal and cancel support for either crown between campaigns. For five years, neither crown can enlist your support through an invitation or a military treaty. Existing treaties stay in force."
 aoc_hyw_promote_appanage: "Promote to Appanage"
 aoc_hyw_promote_appanage_desc: "Between campaigns, promote an eligible direct French vassal to an Appanage. It remains a French subject and stays neutral in the Hundred Years’ War unless it pledges support."
 aoc_hyw_tension: "Tension"
 aoc_hyw_tension_desc: "Tension #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/[ScriptedProgressBar.GetMaxValue|0]#!"
 aoc_hyw_tension_rivalry: "Rival claims in France"
 aoc_hyw_tension_maine: "Maine withheld"
 aoc_hyw_tension_claim: "English claim to the French throne"
 aoc_hyw_tension_war: "Diplomatic play or war underway"
 aoc_hyw_claim_throne: "Claim the French Throne"
 aoc_hyw_claim_throne_desc: "Press England’s claim to the French crown before the first campaign. England gains #v 75#! Infamy and receives the following effect until the journal ends.\n[GetStaticModifier('aoc_hyw_throne_claim_infamy').GetDesc]\n\nTension rises by an additional #v 1#! each month in peacetime. If England wins the contest, France becomes the junior partner in a [concept_personal_union]."
 aoc_hyw_influence: "Influence French Subjects"
 aoc_hyw_influence_desc: "Raise a French appanage’s Liberty Desire by #v 25#! and keep it neutral for five years and through at least the next campaign. England pays @money!#v 1,000#! per week for twelve months."
 aoc_hyw_grant_titles: "Grant Subject Titles"
 aoc_hyw_grant_titles_desc: "Reduce a French subject’s Liberty Desire by #v 25#! and secure its pledge for the next campaign. France pays @money!#v 1,000#! per week for twelve months."
 aoc_hyw_demand_autonomy: "Petition France to Confirm Privileges"
 aoc_hyw_demand_autonomy_desc: "Petition the French crown to confirm our privileges. If France agrees, we pledge support for the next campaign and pay @money!#v 1,000#! per week for twelve months."
 aoc_hyw_invite: "Invite to War"
 aoc_hyw_invite_unavailable: "Invite between campaigns, once the six-month cooldown has expired."
 aoc_hyw_invite_no_targets: "No eligible countries. Improve Relations and check regional interests."
 aoc_restore_appanage: "Restore Appanage"
 aoc_restore_appanage_desc: "Restore the Appanage relationship with its overlord."
 aoc_hyw_invite_desc: "Ask a country with at least #v 50#! Relations to pledge support. Your interest in its capital's strategic region must be #v Engaged#! or higher. The target must have an interest of any tier in your capital's strategic region. If it accepts, it joins the journal and receives a summons when a campaign begins."
 aoc_hyw_english_treaty: "Settlement of the Two Crowns"
 aoc_hyw_influence_treaty: "English Subsidy"
 aoc_hyw_subsidy_payment: "$money_transfer$"
 aoc_hyw_subsidy_payment_desc: "England pays this Appanage until the subsidy expires. Neither party can withdraw early."
 aoc_hyw_titles_treaty: "Grant of Titles and Revenues"
 aoc_hyw_autonomy_treaty: "Confirmation of Provincial Privileges"
 aoc_hyw_maine_concession: "The Surrender of Maine"
 aoc_hyw_subject_privileges: "Confirmed Provincial Privileges"
 aoc_hyw_maine_title: "The Surrender of Maine"
 aoc_hyw_maine_desc: "The truce at Tours gave both crowns time to consider a lasting peace. The French now demand the delivery of Maine. Our captains at Le Mans have asked for orders, and the council must decide whether the garrison is to march out or hold the town."
 aoc_hyw_maine_flavor: "At Le Mans, the garrison has been ordered to keep its horses saddled."
 aoc_hyw_maine_yield: "Deliver Maine to the French."
 aoc_hyw_maine_hold: "The garrison stays."
 aoc_hyw_maine_refused_tt: "Tension rises by an additional #v 0.5#! each month in peacetime while England or an English subject holds land in Maine-Anjou."
 aoc_hyw_maine_returned_title: "The Keys of Le Mans"
 aoc_hyw_maine_returned_desc: "The English council has ordered its captains to quit Maine. Royal officers are preparing to receive the keys of Le Mans and hear the oaths of the townsmen."
 aoc_hyw_maine_returned_option: "Send our officers to take possession."
 aoc_hyw_maine_denied_title: "Maine Withheld"
 aoc_hyw_maine_denied_desc: "Our envoys have returned without an order for the surrender of Maine. The English garrison still holds Le Mans, and its captains are laying in provisions."
 aoc_hyw_maine_denied_option: "Have the frontier watched."
 aoc_hyw_summons_title: "A Summons to Arms"
 aoc_hyw_summons_desc: "An envoy from [SCOPE.sCountry('aoc_hyw_summoning_crown').GetName] has come to collect on our pledge. The armies are gathering, and the envoy asks where our levies will muster."
 aoc_hyw_summons_accept: "Give the envoy a muster date."
 aoc_hyw_summons_refuse: "Send the envoy home alone."
 aoc_hyw_refusal_title: "An Unanswered Muster"
 aoc_hyw_refusal_desc: "[SCOPE.sCountry('aoc_hyw_refusing_country').GetName] has refused our summons. The officers drawing up the muster rolls have struck out the promised contingent."
 aoc_hyw_refusal_option: "Our captains will have to make do."
 aoc_hyw_autonomy_title: "A Petition for Privileges"
 aoc_hyw_autonomy_desc: "Delegates from [SCOPE.sCountry('aoc_hyw_petitioner').GetName] ask the Crown to confirm their right to administer their own courts. They offer a contribution to the royal treasury and promise troops when next we call."
 aoc_hyw_autonomy_accept: "Confirm their privileges under the royal seal."
 aoc_hyw_autonomy_reject: "The royal courts will retain their jurisdiction."
 aoc_hyw_invitation_title: "A Request for Aid"
 aoc_hyw_invitation_desc: "An envoy from [SCOPE.sCountry('aoc_hyw_inviting_crown').GetName] asks what aid we would send if the truce were broken. Our answer will go back under seal."
 aoc_hyw_invitation_accept: "They may count on our support."
 aoc_hyw_invitation_decline: "Give the envoy no undertaking."
 aoc_hyw_support_news_title: "A New Banner"
 aoc_hyw_support_news_desc: "[SCOPE.sCountry('aoc_hyw_announced_supporter').GetName] has taken the side of [SCOPE.sCountry('aoc_hyw_announced_crown').GetName] in the Hundred Years’ War. The crown may now call upon its new supporter when the next campaign begins."
 aoc_hyw_support_news_flavor: "The clerk broke the seal and read the dispatch aloud. Before he reached the signature, a councillor had drawn the map across the table and put a finger to the roads."
 aoc_hyw_support_news_option: "See that the council has a copy."
 war_goal_aoc_hyw_supremacy_type_name: "$aoc_hyw_supremacy$"
 war_goal_aoc_hyw_supremacy_type_desc: "$aoc_hyw_supremacy_desc$"
 war_goal_aoc_hyw_supremacy: "$aoc_hyw_supremacy$"
 war_goal_aoc_hyw_supremacy_desc: "$aoc_hyw_supremacy_desc$"
 war_goal_aoc_hyw_supremacy_sway_desc: "$aoc_hyw_supremacy_desc$"
 dp_aoc_hyw_tooltip: "$dp_aoc_hyw_desc$"

 aoc_hyw_throne_claim_infamy: "Claim to the French Throne"
 aoc_hyw_stalemate_header: "An Inconclusive Peace"
 aoc_hyw_stalemate_condition: "Three campaigns have ended in stalemate"
 aoc_hyw_stalemate_desc: "After three inconclusive campaigns, the crowns let the truce stand. England retains its French possessions."
 aoc_hyw_english_army_total: "[JournalEntry.MakeScope.Var('aoc_hyw_english_army').GetValue|v0]"
 aoc_hyw_english_navy_total: "[JournalEntry.MakeScope.Var('aoc_hyw_english_navy').GetValue|v0]"
 aoc_hyw_french_army_total: "[JournalEntry.MakeScope.Var('aoc_hyw_french_army').GetValue|v0]"
 aoc_hyw_french_navy_total: "[JournalEntry.MakeScope.Var('aoc_hyw_french_navy').GetValue|v0]"
 aoc_hyw_internal_play_restricted_tt: "While the Hundred Years’ War journal is active, its participants can only fight each other through its scripted campaigns."
