l_english:
 je_warlord_china: "The Ming Mandate"
 je_warlord_china_lobby: "The empire's distant provinces test the authority of the Ming court. Restore order and secure the dynasty's mandate."
 je_warlord_china_reason: "A vast court and distant provincial offices strain imperial government. Restore the dynasty’s authority through sound finances, domestic peace, and sustained order. Research $renaissance$ to consolidate the settlement."
 aoc_ming_stability_tt: "Maintain 36 consecutive months of independent, peaceful rule: Legitimacy at least 60, no borrowing or revolution, and Turmoil below 25% in every incorporated state. Progress: #v [ROOT.GetCountry.MakeScope.Var('aoc_ming_stability_months').GetValue|0]#!/36 months."
 aoc_ming.1.t: "The Mandate Renewed"
 aoc_ming.1.d: "Three years of orderly government have restored confidence in the dynasty. Provincial revenues arrive, the court’s instructions are obeyed, and the empire can turn to longer ambitions."
 aoc_ming.1.f: "The memorials still report disputes and shortages. For once, they also report that the officials sent to resolve them have been heard."
 aoc_ming.1.a: "Let good government sustain the dynasty."
