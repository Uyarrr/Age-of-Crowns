l_english:
 law_hereditary_bureaucrats_desc: "Offices are held by families who pass their seals, records, and responsibilities from one generation to the next."
 law_crownland_diets_desc: "The landholding estates of each crownland gather in a diet to weigh petitions, consent to levies, and settle provincial affairs."
 law_appointed_bureaucrats_desc: "Commissions are issued to salaried officers who keep the registers of the state and answer to the authority that appointed them."
 law_elected_bureaucrats_desc: "Local electors choose the magistrates who keep their registers, hear petitions, and conduct the ordinary business of government."
 law_hindu_caste_enforced_desc: "Courts and officials uphold hereditary distinctions of caste in questions of occupation, marriage, and public standing."
 law_hindu_caste_codified_desc: "Officials set down caste distinctions in written registers. Courts consult them when ruling on status and customary obligations."
 law_hindu_caste_not_enforced_desc: "Caste remains a matter of social custom. Courts hear claims under the ordinary law regardless of a person's standing by birth."
 law_affirmative_action_desc: "Public authorities reserve places in schools and offices for communities long excluded from them by caste."
 law_state_religion_desc: "The established faith furnishes the rites of public office, and its worship is maintained under the protection of the state."
 law_millet_system_desc: "The Ottoman Porte hears its recognized confessional communities through their religious authorities, who oversee communal affairs and answer for obligations to the state."
 law_people_of_the_book_desc: "Under a pact of protection, recognized communities of the Book keep their worship and settle certain communal matters under their own authorities."
 law_freedom_of_conscience_desc: "The established faith retains its public rites, while dissenters may keep their own convictions and worship under civil protection."
 law_total_separation_desc: "Public office and civil law stand apart from religious authority. Each congregation orders its own worship."
 law_state_atheism_desc: "Public authorities take over the institutions once entrusted to religious bodies and exclude worship from state ceremonies."
 law_subjecthood_desc: "Allegiance is owed to the sovereign. The peoples of the realm keep their own customs and answer to the Crown as its subjects."
 law_no_colonial_affairs_desc: "Merchants may seek their fortunes abroad on their own account. The state issues no commission to plant settlements beyond its borders."
 law_frontier_colonization_desc: "Surveyors and settlers follow the frontier garrisons. Land grants and new posts extend the state's claims into country already inhabited by other peoples."
 law_colonial_resettlement_desc: "Settlers are granted land in colonies founded under the state's charter, often at the expense of the communities already living there."
 law_autocracy_desc: "Petitions and appeals rise to the sovereign, whose word is the final authority in matters of state."
 law_neo_absolutism_desc: "The sovereign governs by decree through a salaried administration, drawing the provinces into a common system of courts and offices."
 law_technocracy_desc: "The direction of public affairs is entrusted to trained specialists, who claim authority through their knowledge of administration and the useful arts."
 law_oligarchy_desc: "A narrow circle of powerful families or officeholders meets in council and shares the conduct of government."
 law_organic_regulation_desc: "Under the Organic Regulations, assemblies of boyars conduct public affairs and take part in the choice of the prince."
 law_landed_voting_desc: "The franchise belongs to those whose land or other property meets the qualification. Their names are entered on the rolls before an election is called."
 law_outlawed_dissent_desc: "Those who publish attacks on the government or gather to contest its authority may be brought before the courts for sedition."
 law_censorship_desc: "Printers submit copy to a licenser before setting type, and magistrates may confiscate pamphlets published without permission."
 law_right_of_assembly_desc: "Subjects may gather to deliberate on public affairs, prepare petitions, and present their grievances to the authorities."
 law_protected_speech_desc: "The law protects public debate and the printed word, including criticism of those who hold office."
 law_chiefdom_desc: "Clans owe allegiance to a chief whose authority rests on kinship, customary obligation, and the consent of leading households."
 law_monarchy_desc: "The Crown passes within a ruling house. Oaths are sworn to the monarch, in whose name justice is dispensed and officers are appointed."
 law_colonial_administration_desc: "A governor acts under instructions from the metropole, administering its settlements and reporting their affairs to authorities overseas."
 law_presidential_republic_desc: "The republic entrusts executive office to a president chosen for a term, while representatives sit in a separate legislature."
 law_parliamentary_republic_desc: "The assembly debates and makes the laws. Ministers exercise executive authority for as long as they retain its confidence."
 law_theocracy_desc: "Religious office carries the authority to govern. Sacred law and the judgments of its interpreters guide the affairs of the realm."
 law_no_home_affairs_desc: "Magistrates call on the ordinary officers of the peace and, in cases of grave disorder, petition for troops."
 law_national_guard_desc: "Citizens muster under officers of their own corps, bearing arms in defence of the public peace."
 law_secret_police_desc: "Agents attend meetings, cultivate informants, and file private reports on those suspected of conspiring against the government."
 law_guaranteed_liberties_desc: "A magistrate must show lawful cause before detaining a subject. Those held by the state may challenge their detention before a court."
 law_guild_system_desc: "Chartered guilds take apprentices, examine masters, and settle disputes over the practice of their trades."
 law_tenant_farmers_desc: "Families work land held by landlords, owing rent under a lease or the custom of the estate."
 law_homesteading_desc: "Families take title to the plots they settle and work, establishing farms held in their own right."
 law_no_migration_controls_desc: "Travellers and households cross the frontier without seeking leave to settle from a state office."
 law_migration_controls_desc: "Border officials examine permits and letters of passage to determine who may enter, depart, or take up residence."
 law_closed_borders_desc: "Guards close the crossings to migration, and officials deny leave to those seeking to settle across the frontier."
 law_slavery_banned_desc: "The courts recognize no claim of ownership over a person. Those held in bondage have the right to their freedom."
 law_colonial_slavery_desc: "Colonial law recognizes slavery on plantations and estates abroad, while the courts of the metropole observe the principle of free soil."
 law_debt_slavery_desc: "Creditors may claim the person or labour of a debtor who cannot satisfy a bond."
 law_slave_trade_desc: "Merchants buy and sell enslaved people under the protection of law, and customs officers record their arrival as cargo."
 law_legacy_slavery_desc: "The law recognizes existing claims of ownership over enslaved people, while forbidding the extension of slavery to new grounds."
 law_consumption_based_taxation_desc: "Revenue officers collect excise on goods at the market, the warehouse, and the town gate."
 law_land_based_taxation_desc: "Assessors record fields, holdings, and their yields. The collector levies dues against the land entered in the rolls."
 law_per_capita_based_taxation_desc: "Collectors reckon a charge by counting persons on the tax rolls."
 law_proportional_taxation_desc: "Assessors reckon what each taxpayer earns and levy a fixed share of the sum."
 law_graduated_taxation_desc: "The treasury looks to the profits of investors and proprietors as well as to the income declared by each household."
 law_mercantilism_desc: "The Crown encourages exports and reserves favoured routes to chartered merchants, seeking to draw bullion into the realm."
 law_protectionism_desc: "Duties are laid on competing wares at the frontier in defence of domestic workshops and manufactures."
 law_free_trade_desc: "Merchants may buy and sell abroad without the exclusive rights of chartered companies or duties imposed to shelter domestic trades."
 law_isolationism_desc: "Foreign merchants are denied free entry to the realm. Dealings across the frontier take place under the eye of appointed officials."
 law_canton_system_desc: "Western merchants trade at Canton under the supervision of the maritime customs office and through licensed hong merchants."
